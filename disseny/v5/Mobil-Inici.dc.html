<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<title>Aprenem · Inici (mòbil)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
.ap{font-family:'Lexend',system-ui,sans-serif;color:#14213D;background:#F4F6FA}
.ap *{box-sizing:border-box}
.card{background:#fff;border:1px solid #E2E7EF;box-shadow:0 1px 2px rgba(20,33,61,.05)}
.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#64708A}
.btn{border:0;font:600 16px 'Lexend',sans-serif;color:#fff;background:#F26B1D;box-shadow:0 3px 0 #C4500F;height:50px;width:100%}
.ico{width:38px;height:38px;flex:none;display:grid;place-items:center;color:#fff}
.m{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px;background:#fff;border:1px solid #E2E7EF;font:600 12px 'Lexend',sans-serif;color:#14213D}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border:1px solid #E2E7EF;border-left:4px solid var(--c)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 12px;font-size:11px;color:#64708A;text-decoration:none}
a{color:#1D3FA8}a:hover{color:#14213D}
</style>
</helmet>
<div class="ap" style="width:390px;height:844px;display:flex;flex-direction:column">
<div style="flex:1;overflow:hidden;padding:14px 16px 0;display:flex;flex-direction:column;gap:16px">
<div style="display:flex;align-items:center;gap:10px">
<svg viewBox="0 0 40 40" width="32" height="32" aria-hidden="true"><rect width="40" height="40" fill="#14213D"></rect><path d="M7 8l6 5M33 8l-6 5" stroke="#fff" stroke-width="2.5"></path><circle cx="14" cy="19" r="7" fill="#fff"></circle><circle cx="26" cy="19" r="7" fill="#fff"></circle><circle cx="14" cy="19" r="3" fill="#14213D"></circle><circle cx="26" cy="19" r="3" fill="#14213D"></circle><path d="M17.5 26h5L20 30Z" fill="#F26B1D"></path></svg>
<div style="flex:1"><div style="font-size:20px;font-weight:700">Bona tarda!</div></div>
<span style="display:flex;align-items:center;gap:4px;font-weight:700;color:#D9741A;font-size:14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.2 1-3.6 2.2-4.8.2 1.6 1 2.6 2.3 3 .2-3.3-.7-5.8.5-8.2Z"></path></svg>5</span>
<svg width="44" height="44" viewBox="0 0 44 44" role="img" aria-label="12 de 20 minuts"><circle cx="22" cy="22" r="17" fill="none" stroke="#E2E7EF" stroke-width="5"></circle><circle cx="22" cy="22" r="17" fill="none" stroke="#2BA36B" stroke-width="5" stroke-dasharray="64 107" transform="rotate(-90 22 22)"></circle><text x="22" y="26" text-anchor="middle" font-family="Lexend" font-weight="700" font-size="12" fill="#14213D">12'</text></svg>
</div>

<div class="card" style="display:flex;overflow:hidden">
<div style="width:6px;background:#3B6FE0"></div>
<div style="flex:1;padding:16px;display:flex;flex-direction:column;gap:10px">
<div class="lbl">Continua on ho deixares</div>
<div style="font-size:18px;font-weight:700;line-height:1.25">Mates · U7 Nombres decimals</div>
<div style="display:flex;align-items:center">
<span style="width:24px;height:24px;display:grid;place-items:center;background:#3B6FE0;color:#fff;font-size:11px">✓</span><span style="flex:1;height:3px;background:#3B6FE0"></span>
<span style="width:24px;height:24px;display:grid;place-items:center;background:#3B6FE0;color:#fff;font-size:11px">✓</span><span style="flex:1;height:3px;background:#3B6FE0"></span>
<span style="width:24px;height:24px;display:grid;place-items:center;background:#fff;border:3px solid #3B6FE0;color:#3B6FE0;font-size:11px;font-weight:700">3</span><span style="flex:1;height:3px;background:#D5DCE8"></span>
<span style="width:24px;height:24px;display:grid;place-items:center;background:#fff;border:2px solid #D5DCE8;color:#8A94AA;font-size:11px;font-weight:700">4</span>
</div>
<button class="btn">Continua →</button>
</div>
</div>

<div>
<h2 style="margin:0 0 10px;font-size:16px">Com vols practicar?</h2>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
<button class="m"><span class="ico" style="background:#3B6FE0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 9 12 4l10 5-10 5ZM6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"></path></svg></span>Professor</button>
<button class="m"><span class="ico" style="background:#2BA36B"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h7v7H3ZM14 3h7v7h-7ZM3 14h7v7H3ZM14 17.5h7M17.5 14v7"></path></svg></span>Exercicis</button>
<button class="m"><span class="ico" style="background:#F08A24"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3ZM9 3v15M15 6v15"></path></svg></span>Aventura</button>
<button class="m"><span class="ico" style="background:#7B5CE0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 2 8l10 5 10-5ZM2 13l10 5 10-5M2 18l10 5 10-5"></path></svg></span>Sessió mixta</button>
<button class="m"><span class="ico" style="background:#E0457B"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16ZM13 7l4 4"></path></svg></span>Escriptura</button>
<button class="m"><span class="ico" style="background:#14213D"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18ZM8 12l3 3 5-6"></path></svg></span>Comprovació</button>
</div>
</div>

<div>
<h2 style="margin:0 0 10px;font-size:16px">Assignatures</h2>
<div style="display:flex;flex-direction:column;gap:6px">
<div class="row" style="--c:#E0457B"><b style="flex:1">Català</b><span style="width:90px;height:6px;background:#E2E7EF"><i style="display:block;height:6px;width:42%;background:#E0457B"></i></span><b style="width:38px;text-align:right">42%</b></div>
<div class="row" style="--c:#F08A24"><b style="flex:1">Castellà</b><span style="width:90px;height:6px;background:#E2E7EF"><i style="display:block;height:6px;width:18%;background:#F08A24"></i></span><b style="width:38px;text-align:right">18%</b></div>
<div class="row" style="--c:#3B6FE0"><b style="flex:1">Matemàtiques</b><span style="width:90px;height:6px;background:#E2E7EF"><i style="display:block;height:6px;width:65%;background:#3B6FE0"></i></span><b style="width:38px;text-align:right">65%</b></div>
<div class="row" style="--c:#D6453D"><b style="flex:1">Anglès</b><span style="width:90px;height:6px;background:#E2E7EF"><i style="display:block;height:6px;width:30%;background:#D6453D"></i></span><b style="width:38px;text-align:right">30%</b></div>
<div class="row" style="--c:#2BA36B"><b style="flex:1">Medi</b><span style="width:90px;height:6px;background:#E2E7EF"><i style="display:block;height:6px;width:51%;background:#2BA36B"></i></span><b style="width:38px;text-align:right">51%</b></div>
</div>
</div>
</div>

<nav style="display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #E2E7EF">

<a class="tab" href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H3ZM21 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7Z"></path></svg>Assignatures</a>
<a class="tab" href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Progrés</a>
<a class="tab" href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11h16v10H4ZM8 11V7a4 4 0 0 1 8 0v4"></path></svg>Famílies</a>
</nav>
</div>
</x-dc>

</html>

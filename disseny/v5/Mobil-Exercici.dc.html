<!doctype html>

<head>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
.ap{font-family:'Lexend',system-ui,sans-serif;color:#14213D;background:#fff}
.ap *{box-sizing:border-box}
.btn{border:0;font:600 17px 'Lexend',sans-serif;color:#fff;background:#F26B1D;box-shadow:0 4px 0 #C4500F;height:56px;width:100%}
.btn2{border:1px solid #CBD3E1;font:600 14px 'Lexend',sans-serif;color:#14213D;background:#fff;box-shadow:0 2px 0 #CBD3E1;height:44px;flex:1;display:flex;align-items:center;justify-content:center;gap:6px}
a{color:#1D3FA8}a:hover{color:#14213D}
</style>
</helmet>
<div class="ap" style="width:390px;height:844px;display:flex;flex-direction:column">
<header style="display:flex;align-items:center;gap:12px;padding:14px 16px">
<button aria-label="Sortir" style="width:40px;height:40px;border:1px solid #D5DCE8;background:#fff;display:grid;place-items:center;color:#4A5672"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
<div style="flex:1;display:flex;gap:3px"><span style="flex:1;height:9px;background:#2BA36B"></span><span style="flex:1;height:9px;background:#2BA36B"></span><span style="flex:1;height:9px;background:#F5B946"></span><span style="flex:1;height:9px;background:#3B6FE0"></span><span style="flex:1;height:9px;background:#E2E7EF"></span><span style="flex:1;height:9px;background:#E2E7EF"></span><span style="flex:1;height:9px;background:#E2E7EF"></span><span style="flex:1;height:9px;background:#E2E7EF"></span></div>
<span style="font-size:13px;font-weight:600;color:#4A5672">4/8</span>
</header>
<div style="flex:1;padding:8px 20px 0;display:flex;flex-direction:column;gap:18px">
<div style="font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#3B6FE0">Mates · Decimals</div>
<div style="font-size:21px;line-height:1.45;font-weight:500">La Laia compra <b>2,75 kg</b> de pomes i <b>1,5 kg</b> de peres. Quants quilos compra en total?</div>
<div style="padding:14px;background:#F7F9FC;border:1px dashed #D5DCE8;display:grid;place-items:center">
<svg width="300" height="80" viewBox="0 0 300 96" aria-hidden="true"><rect x="10" y="40" width="120" height="46" fill="#E44B4B"></rect><rect x="30" y="20" width="80" height="20" fill="none" stroke="#14213D" stroke-width="3"></rect><text x="70" y="70" text-anchor="middle" font-family="Lexend" font-weight="700" font-size="18" fill="#fff">2,75 kg</text><rect x="170" y="40" width="110" height="46" fill="#9BCB4A"></rect><rect x="190" y="20" width="70" height="20" fill="none" stroke="#14213D" stroke-width="3"></rect><text x="225" y="70" text-anchor="middle" font-family="Lexend" font-weight="700" font-size="18" fill="#14213D">1,5 kg</text><text x="150" y="70" text-anchor="middle" font-family="Lexend" font-weight="700" font-size="24" fill="#14213D">+</text></svg>
</div>
<div style="display:flex;gap:8px"><button class="btn2"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3Z"></path></svg>Pista</button><button class="btn2"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4ZM16 9a4 4 0 0 1 0 6"></path></svg>Llegeix</button><button class="btn2">Teoria</button></div>
</div>
<div style="background:#FFF6E0;border-top:4px solid #E0A21B;padding:16px 20px 20px;display:flex;flex-direction:column;gap:12px">
<div style="font-size:15px;line-height:1.5"><b>Gairebé!</b> Posa les comes una davall l'altra: escriu 1,5 com a <b>1,50</b>.</div>
<div style="display:flex;align-items:center;height:58px;border:2px solid #E0A21B;background:#fff;padding:0 16px;font-size:26px;font-weight:600">2,90<span style="margin-left:auto;font-size:15px;color:#64708A;font-weight:500">kg</span></div>
<button class="btn">Comprova</button>
</div>
</div>
</x-dc>

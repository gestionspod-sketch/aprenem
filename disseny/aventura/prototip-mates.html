<title>Aventura interactiva</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap">
<style>
:root{--ink:#1E1B3A;--mut:#8A879E;--bg:#F1F4F8;--card:#fff;--pur:#8B6CF0;--purd:#4B2FB8;--lav:#E3D9FD;--peach:#FDE3B8;--org:#F2853A;--mint:#D4F1E4;--grn:#2BA36B;--sky:#D6E8FD;--pink:#FBDDEB;--yel:#FFF4DE;--yeld:#6B4A12;--sea:#7CC6E8;--sand:#F6E3B4;--line:#E4E7EE}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:400;margin:0}
.wrap{max-width:860px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top h1{font-size:22px;font-weight:500;margin:0;flex:1;text-wrap:balance}
.pill{background:var(--card);border-radius:16px;padding:8px 14px;font-weight:500;font-size:14px;display:flex;align-items:center;gap:6px}
.card{background:var(--card);border-radius:26px;padding:20px;box-shadow:0 6px 20px rgba(30,27,58,.05)}
.eyebrow{font-size:13px;color:var(--pur);font-weight:500}
h2{font-size:21px;font-weight:500;margin:2px 0 6px;text-wrap:balance}
p{line-height:1.55;margin:0 0 10px}
.muted{color:var(--mut)}
button{font:500 16px 'Poppins',sans-serif;border:0;cursor:pointer;border-radius:22px;min-height:48px;padding:0 24px;background:var(--pur);color:#fff}
button.sec{background:var(--bg);color:var(--ink)}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--yel);color:var(--yeld);border-radius:18px;padding:14px 16px;margin-top:14px;line-height:1.5}
.tip.ok{background:var(--mint);color:#1F5E40}
.tip svg{flex:none}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-weight:500;margin:0 2px}
.fr i{font-style:normal;border-top:2px solid currentColor;padding-top:1px}
svg text{font-family:'Poppins',sans-serif}
.map{width:100%;height:auto;display:block;border-radius:22px;touch-action:manipulation}
.st{cursor:pointer}
.tray{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.plank{min-height:52px;border-radius:14px;padding:0 16px;font-size:18px;color:var(--ink)}
.stage{width:100%;height:auto;display:block;touch-action:none;user-select:none}
.ans{display:flex;align-items:center;gap:10px;margin-top:14px}
.ans input{flex:1;min-width:0;height:58px;border-radius:20px;border:2px solid var(--pur);background:#EFEAFE;font:500 24px 'Poppins',sans-serif;color:var(--purd);padding:0 18px;outline:none}
.steps{margin:10px 0 0;padding-left:20px;line-height:1.7}
.gem{display:inline-block;width:14px;height:14px;background:#5FD3C4;transform:rotate(45deg);border-radius:3px}
.gem.off{background:#DCDFE7}
@media (max-width:520px){.top h1{font-size:18px}h2{font-size:19px}.card{padding:16px}}
</style>

<div class="wrap">
 <div class="top">
  <h1>L'Illa dels Nombres Perduts</h1>
  <span class="pill" id="gems"></span>
 </div>
 <div id="app"></div>
 <p class="muted" style="font-size:13px;margin-top:14px">Prototip per provar la idea: una aventura de Matemàtiques (fraccions i decimals) amb tres proves que es juguen movent coses. Les dades canvien cada partida.</p>
</div>

<script>
const OWL=(s=40)=>`<svg viewBox="0 0 120 120" width="${s}" height="${s}" aria-hidden="true"><ellipse cx="60" cy="72" rx="40" ry="42" fill="#8B6CF0"/><ellipse cx="60" cy="86" rx="25" ry="24" fill="#EDE6FF"/><path d="M26 42 34 22 48 36ZM94 42 86 22 72 36Z" fill="#8B6CF0"/><circle cx="45" cy="56" r="15" fill="#fff"/><circle cx="75" cy="56" r="15" fill="#fff"/><circle cx="47" cy="57" r="6" fill="#1E1B3A"/><circle cx="73" cy="57" r="6" fill="#1E1B3A"/><path d="M55 68h10l-5 8Z" fill="#F2853A"/></svg>`;
const $=s=>document.querySelector(s);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const gcd=(a,b)=>b?gcd(b,a%b):a;
const FR=(n,d)=>{const g=gcd(n,d);n/=g;d/=g;return d===1?`${n}`:`<span class="fr">${n}<i>${d}</i></span>`};
const dec=x=>(Math.round(x*100)/100).toString().replace('.',',');
let G={pos:0,gems:[null,null,null]};
const STN=[{x:110,y:250,nom:'El pont trencat'},{x:300,y:150,nom:'El riu de les pedres'},{x:500,y:235,nom:'La porta del guardià'},{x:610,y:110,nom:'El tresor'}];

function gemsBar(){$('#gems').innerHTML=G.gems.map(g=>`<span class="gem ${g?'':'off'}"></span>`).join('')+` <span>${G.gems.filter(Boolean).length} gemmes</span>`}

/* ---------- MAPA ---------- */
function map(){gemsBar();const o=STN[G.pos];
 $('#app').innerHTML=`<div class="card" style="padding:12px">
 <svg class="map" viewBox="0 0 700 340" role="img" aria-label="Mapa de l'illa">
  <rect width="700" height="340" fill="#BFE6F5"/>
  <path d="M40 300C20 220 60 120 160 90 260 60 330 40 430 70 560 100 690 70 670 190 655 290 560 320 400 318 240 330 70 345 40 300Z" fill="#F6E3B4"/>
  <path d="M70 290C60 230 90 150 170 120 260 92 330 80 420 100 540 125 640 110 630 200 620 270 540 295 400 292 250 300 95 315 70 290Z" fill="#CDE9B5"/>
  <circle cx="200" cy="260" r="18" fill="#9DD18A"/><circle cx="420" cy="140" r="22" fill="#9DD18A"/><circle cx="560" cy="290" r="16" fill="#9DD18A"/>
  <path d="M110 250C180 240 230 190 300 150S440 230 500 235 590 140 610 110" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 18"/>
  ${STN.map((s,i)=>{const done=i<G.pos,cur=i===G.pos,lock=i>G.pos;
   return `<g class="st" data-i="${i}" ${cur&&i<3?'tabindex="0" role="button"':''}>
    <circle cx="${s.x}" cy="${s.y}" r="${cur?30:24}" fill="${done?'#5FD3C4':cur?'#8B6CF0':'#fff'}" stroke="${lock?'#D9D6E4':'#fff'}" stroke-width="4"/>
    <text x="${s.x}" y="${s.y+6}" text-anchor="middle" font-size="${i===3?20:18}" font-weight="500" fill="${cur||done?'#fff':'#B5B3C4'}">${i===3?'★':done?'✓':i+1}</text>
    <text x="${s.x}" y="${s.y+(i===1||i===3?-40:48)}" text-anchor="middle" font-size="14" fill="#1E1B3A">${s.nom}</text></g>`}).join('')}
  <g id="tok" transform="translate(${o.x-22},${o.y-78})">${OWL(44).replace('<svg','<svg x="0" y="0"')}</g>
 </svg>
 <div class="row" style="justify-content:space-between;padding:10px 8px 4px">
  <div><div class="eyebrow">${G.pos<3?'Prova '+(G.pos+1)+' de 3':'Final'}</div><div style="font-weight:500;font-size:18px">${o.nom}</div></div>
  <button id="go">${G.pos<3?'Entra a la prova':'Obre el tresor'}</button>
 </div></div>`;
 const enter=()=>[pont,riu,porta,tresor][G.pos]();
 $('#go').onclick=enter;
 document.querySelectorAll('.st').forEach(g=>{g.onclick=()=>{if(+g.dataset.i===G.pos)enter()};g.onkeydown=e=>{if(e.key==='Enter'&&+g.dataset.i===G.pos)enter()}});
}
function advance(gem){G.gems[G.pos]=gem;G.pos++;gemsBar();
 const a=STN[G.pos-1],b=STN[G.pos];map();const t=$('#tok');const T0=performance.now();
 const step=()=>{const e=Math.min(1,(performance.now()-T0)/700),x=a.x+(b.x-a.x)*e,y=a.y+(b.y-a.y)*e-Math.sin(e*Math.PI)*40;t.setAttribute('transform',`translate(${x-22},${y-78})`);if(e<1)requestAnimationFrame(step)};
 t.setAttribute('transform',`translate(${a.x-22},${a.y-78})`);requestAnimationFrame(step)}

/* ---------- PROVA 1: EL PONT ---------- */
function pont(){let errs=0,help=false;
 function nova(){const T=rnd([[3,4],[5,8],[7,8],[3,8],[1,2],[6,8]]),only=Math.random()<.4?[4,8]:[2,4,8];
  const need=T[0]/T[1];let placed=[];
  const draw=(fill)=>{const tot=placed.reduce((s,d)=>s+1/d,0),x0=120;let x=fill?x0:130;
   const segs=placed.map((d,i)=>{const w=fill?460*(1/d)/tot:Math.min(52,440/placed.length),c={2:'#F7B6A3',4:'#9FC3F5',8:'#A9E0BE'}[d];const s=`<g data-i="${i}" class="pl" style="cursor:pointer"><rect x="${x+1}" y="96" width="${w-2}" height="26" rx="6" fill="${c}" stroke="#fff" stroke-width="2"/><text x="${x+w/2}" y="114" text-anchor="middle" font-size="13" fill="#1E1B3A">1/${d}</text></g>`;x+=fill?w:w+6;return s}).join('');
   $('#bridge').innerHTML=`
    <rect width="700" height="220" fill="#DDF1FA"/>
    <path d="M0 110h120v110H0Z" fill="#B98B5E"/><path d="M580 110h120v110H580Z" fill="#B98B5E"/>
    <path d="M0 104h120v10H0ZM580 104h120v10H580Z" fill="#8FC77A"/>
    <path d="M120 200q230 -30 460 0v20H120Z" fill="#7CC6E8"/>
    <rect x="120" y="70" width="460" height="90" rx="12" fill="#fff" opacity=".55"/>
    <text x="350" y="62" text-anchor="middle" font-size="14" fill="#5E5B74">${fill?'':'Forat tapat per la boira · taulons preparats:'}</text>
    ${segs}
    <g transform="translate(42,40)">${OWL(56).replace('<svg','<svg x="0" y="0"')}</g>`;
   document.querySelectorAll('.pl').forEach(g=>g.onclick=()=>{placed.splice(+g.dataset.i,1);draw()});
   $('#cnt').textContent=placed.length?`Has posat ${placed.length} ${placed.length===1?'tauló':'taulons'}. Toca'n un per treure'l.`:'Encara no has posat cap tauló.';
   $('#chk').disabled=!placed.length;
  };
  $('#app').innerHTML=`<div class="card">
   <div class="eyebrow">Prova 1 · El pont trencat</div>
   <h2>Al pont li falten ${FR(T[0],T[1])} de metre</h2>
   <p>Construeix el tros que falta amb taulons${only.length===2?' de <b>1/4</b> i <b>1/8</b> (els de 1/2 s\'han mullat)':''}. La boira no deixa veure el forat: has de <b>calcular</b> quins taulons sumen exactament ${FR(T[0],T[1])}.</p>
   <svg id="bridge" class="stage" viewBox="0 0 700 220" aria-label="Pont"></svg>
   <div class="tray">${only.map(d=>`<button class="plank" data-d="${d}" style="background:${{2:'#FCD9CE',4:'#D6E8FD',8:'#D4F1E4'}[d]}">+ ${FR(1,d)} m</button>`).join('')}</div>
   <div class="muted" id="cnt" style="font-size:14px"></div>
   <div class="row" style="margin-top:12px"><button id="chk">Prova el pont</button><button class="sec" id="back">Tornar al mapa</button></div>
   <div id="fb"></div></div>`;
  document.querySelectorAll('.plank').forEach(b=>b.onclick=()=>{if(placed.length<12){placed.push(+b.dataset.d);draw()}});
  $('#back').onclick=map;
  $('#chk').onclick=()=>{const sum8=placed.reduce((s,d)=>s+8/d,0),need8=need*8;
   if(sum8===need8){$('#chk').disabled=true;const gem=!errs&&!help;
    $('#fb').innerHTML=`<div class="tip ok">${OWL(36)}<div><b>El pont aguanta!</b> ${placed.map(d=>FR(1,d)).join(' + ')} = ${placed.map(d=>8/d+'/8').join(' + ')} = ${need8}/8 = ${FR(T[0],T[1])} m. ${gem?'Has guanyat una gemma.':''}</div></div><div class="row" style="margin-top:12px"><button id="nx">Creua el pont →</button></div>`;
    draw(true);$('#chk').disabled=true;document.querySelectorAll('.plank').forEach(b=>b.disabled=true);crossAnim();$('#nx').onclick=()=>advance(gem);return}
   errs++;
   if(errs<2){$('#fb').innerHTML=`<div class="tip">${OWL(36)}<div><b>Els taulons cauen a l'aigua.</b> Els teus taulons sumen ${FR(sum8,8)} m i calia ${FR(T[0],T[1])} m. Pensa-hi: quants vuitens són ${FR(T[0],T[1])}?</div></div>`;placed=[];draw();return}
   help=true;
   $('#fb').innerHTML=`<div class="tip">${OWL(36)}<div><b>Ho fem junts, pas a pas.</b><ol class="steps">
     <li>Passa-ho tot a <b>vuitens</b>: un tauló de 1/2 són 4/8, un de 1/4 són 2/8 i un de 1/8 és 1/8.</li>
     <li>${FR(T[0],T[1])} són <b>${need8} vuitens</b>.</li>
     <li>Busca taulons que sumin ${need8} vuitens. Per exemple: ${solve(need8,only).map(d=>FR(1,d)).join(' + ')}.</li></ol>
     Ara en farem un de nou, amb un altre forat.</div></div><div class="row" style="margin-top:12px"><button id="nw">Pont nou</button></div>`;
   $('#chk').disabled=true;$('#nw').onclick=()=>{errs=0;nova()}};
  draw();
  function crossAnim(){const svg=$('#bridge'),g=document.createElementNS('http://www.w3.org/2000/svg','g');svg.querySelector('g:last-of-type').remove();svg.appendChild(g);const T0=performance.now();
   const st=()=>{const k=Math.min(1,(performance.now()-T0)/1400);const x=40+k*560,y=40-Math.abs(Math.sin(k*30))*8;g.innerHTML=`<g transform="translate(${x},${y})">${OWL(56).replace('<svg','<svg x="0" y="0"')}</g>`;if(k<1)requestAnimationFrame(st)};st()}
 }
 function solve(n8,only){const r=[];for(const d of only.slice().sort((a,b)=>a-b)){while(n8>=8/d){r.push(d);n8-=8/d}}return r}
 nova();
}

/* ---------- PROVA 2: EL RIU ---------- */
function riu(){let errs=0,help=false;
 function nova(){const pool=[.2,.3,.45,.5,.65,.75,.8,1.1,1.25,1.4,1.5,1.6,1.75,1.9];let vals=[];
  while(vals.length<3){const v=rnd(pool);if(!vals.some(w=>Math.abs(w-v)<.2))vals.push(v)}vals.sort((a,b)=>a-b);
  const X=v=>60+v*290,placed=[null,null,null];let drag=null,sel=null;
  $('#app').innerHTML=`<div class="card">
   <div class="eyebrow">Prova 2 · El riu de les pedres</div>
   <h2>Posa cada pedra al seu lloc de la recta</h2>
   <p>Arrossega cada pedra fins al punt de la recta on va (o toca una pedra i després el lloc). La recta només té marcats el 0, l'1 i el 2: cada ratlla petita és una dècima.</p>
   <svg id="river" class="stage" viewBox="0 0 700 250" aria-label="Riu amb recta numèrica"></svg>
   <div class="row" style="margin-top:12px"><button id="chk" disabled>Salta per les pedres</button><button class="sec" id="back">Tornar al mapa</button></div>
   <div id="fb"></div></div>`;
  const svg=$('#river');
  const draw=(owlX)=>{let t='';for(let i=0;i<=20;i++){const x=X(i/10),big=i%10===0,half=i%5===0;t+=`<line x1="${x}" y1="${big?132:half?138:142}" x2="${x}" y2="${big?168:half?162:158}" stroke="#1E1B3A" stroke-width="${big?3:2}" opacity="${big?1:.55}"/>`;if(big)t+=`<text x="${x}" y="190" text-anchor="middle" font-size="18" font-weight="500" fill="#1E1B3A">${i/10}</text>`}
   svg.innerHTML=`<rect width="700" height="250" fill="#DDF1FA"/><path d="M0 110q175 -16 350 0t350 0v80q-175 16 -350 0t-350 0Z" fill="#7CC6E8" opacity=".6"/>
    <line x1="${X(0)}" y1="150" x2="${X(2)}" y2="150" stroke="#1E1B3A" stroke-width="3"/>${t}
    ${placed.map((p,i)=>p===null?'':`<g data-i="${i}" class="stone placed" style="cursor:grab"><ellipse cx="${X(p)}" cy="150" rx="22" ry="13" fill="#A39E92" stroke="#fff" stroke-width="2"/><text x="${X(p)}" y="155" text-anchor="middle" font-size="13" fill="#fff">${dec(vals[i])}</text></g>`).join('')}
    ${vals.map((v,i)=>placed[i]!==null?'':`<g data-i="${i}" class="stone" style="cursor:grab"><ellipse cx="${150+i*200}" cy="222" rx="${sel===i?32:28}" ry="${sel===i?19:17}" fill="${sel===i?'#8B6CF0':'#A39E92'}" stroke="#fff" stroke-width="3"/><text x="${150+i*200}" y="228" text-anchor="middle" font-size="16" font-weight="500" fill="#fff">${dec(v)}</text></g>`).join('')}
    <g transform="translate(${owlX??8},70)">${OWL(48).replace('<svg','<svg x="0" y="0"')}</g>`;
   $('#chk').disabled=placed.some(p=>p===null);
  };
  const toVal=e=>{const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)*700/r.width,y=(e.clientY-r.top)*250/r.height;return{v:Math.round(Math.max(0,Math.min(2,(x-60)/290))*20)/20,onLine:y>100&&y<200}};
  svg.onpointerdown=e=>{const g=e.target.closest('.stone');if(!g)return;const i=+g.dataset.i;drag={i,moved:false,g};svg.setPointerCapture(e.pointerId)};
  svg.onpointermove=e=>{if(!drag)return;drag.moved=true;const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)*700/r.width,y=(e.clientY-r.top)*250/r.height;drag.g.setAttribute('transform',`translate(${x-(placed[drag.i]!==null?X(placed[drag.i]):150+drag.i*200)},${y-(placed[drag.i]!==null?150:222)})`)};
  svg.onpointerup=e=>{if(drag){const {i,moved}=drag;drag=null;if(moved){const t=toVal(e);if(t.onLine)placed[i]=t.v;else placed[i]=null;sel=null;draw();return}
     sel=sel===i?null:i;if(placed[i]!==null){placed[i]=null;sel=i}draw();return}
   if(sel!==null){const t=toVal(e);if(t.onLine){placed[sel]=t.v;sel=null;draw()}}};
  $('#back').onclick=map;
  $('#chk').onclick=()=>{const bad=vals.map((v,i)=>Math.abs(placed[i]-v)>.001);
   if(!bad.some(Boolean)){$('#chk').disabled=true;const gem=!errs&&!help;
    const T0=performance.now();const jump=()=>{const k=Math.min(4,(performance.now()-T0)/450);const seg=Math.min(3,Math.floor(k)),e=k-seg;const pts=[8,X(vals[0])-24,X(vals[1])-24,X(vals[2])-24,640];const x=pts[seg]+(pts[seg+1]-pts[seg])*e;draw(x);if(k<4)requestAnimationFrame(jump)};jump();
    $('#fb').innerHTML=`<div class="tip ok">${OWL(36)}<div><b>Has creuat el riu!</b> Totes les pedres eren al seu lloc. ${gem?'Has guanyat una gemma.':''}</div></div><div class="row" style="margin-top:12px"><button id="nx">Continua →</button></div>`;$('#nx').onclick=()=>advance(gem);return}
   errs++;
   const msg=vals.map((v,i)=>bad[i]?`la pedra <b>${dec(v)}</b> l'has posada a ${dec(placed[i])}`:null).filter(Boolean).join('; ');
   if(errs<2){$('#fb').innerHTML=`<div class="tip">${OWL(36)}<div><b>Una pedra s'enfonsa!</b> ${msg[0].toUpperCase()+msg.slice(1)}. Compta les dècimes des del 0 (o des de l'1).</div></div>`;vals.forEach((v,i)=>{if(bad[i])placed[i]=null});draw();return}
   help=true;$('#chk').disabled=true;
   const w=vals.find((v,i)=>bad[i]),ent=Math.floor(w+1e-9),dd=Math.round((w-ent)*100),dc=Math.floor(dd/10),half=dd%10!==0;
   $('#fb').innerHTML=`<div class="tip">${OWL(36)}<div><b>Ho mirem junts.</b><ol class="steps"><li>Entre dos nombres sencers hi ha 10 ratlles petites: cada una és una dècima (<b>0,1</b>).</li><li><b>${dec(w)}</b> és ${ent} i ${dd} centèsimes. Comença ${ent===1?"a l'":'al '}<b>${ent}</b> i compta <b>${dc}</b> ${dc===1?'ratlla':'ratlles'}${half?' i <b>mitja</b> més':''}.</li><li>Fes igual amb les altres pedres.</li></ol>Ara en farem un de nou, amb altres pedres.</div></div><div class="row" style="margin-top:12px"><button id="nw">Riu nou</button></div>`;
   $('#nw').onclick=()=>{errs=0;nova()}};
  draw();
 }
 nova();
}

/* ---------- PROVA 3: LA PORTA (segell, sense pistes) ---------- */
function porta(){let tries=0;
 function nova(){const f=rnd([[1,2],[1,4],[3,4],[1,5],[2,5],[3,10],[7,10]]),d=rnd([.25,.5,.75,1.2,1.5,.3,.6]);const ans=Math.round((f[0]/f[1]+d)*100)/100;
  $('#app').innerHTML=`<div class="card" style="text-align:center">
   <div class="eyebrow">Prova 3 · La porta del guardià</div>
   <div style="display:flex;justify-content:center;margin:6px 0">${OWL(84)}</div>
   <h2>«Respon-me sense ajuda i la porta s'obrirà»</h2>
   <p>Calcula i escriu el resultat <b>en decimal</b>:</p>
   <div style="font-size:30px;font-weight:400;margin:10px 0">${FR(f[0],f[1])} + ${dec(d)} = ?</div>
   <div class="ans" style="max-width:420px;margin:14px auto 0"><input id="in" inputmode="decimal" autocomplete="off" placeholder="Escriu-lo aquí" aria-label="Resposta"><button id="chk">Comprova</button></div>
   <div id="fb" style="text-align:left"></div>
   <div class="row" style="justify-content:center;margin-top:12px"><button class="sec" id="back">Tornar al mapa</button></div></div>`;
  $('#back').onclick=map;const t0=Date.now();
  const go=()=>{const raw=$('#in').value.trim().replace(',','.');if(!raw)return;const v=parseFloat(raw);
   if(Math.abs(v-ans)<.001){$('#fb').innerHTML=`<div class="tip ok">${OWL(36)}<div><b>La porta s'obre!</b> ${FR(f[0],f[1])} = ${dec(f[0]/f[1])}, i ${dec(f[0]/f[1])} + ${dec(d)} = ${dec(ans)}. ${tries?'':'Has guanyat una gemma.'}</div></div><div class="row" style="margin-top:12px;justify-content:center"><button id="nx">Entra →</button></div>`;$('#chk').disabled=true;$('#nx').onclick=()=>advance(!tries);return}
   if(Date.now()-t0<4000){$('#fb').innerHTML=`<div class="tip">${OWL(36)}<div><b>Pensa abans de respondre.</b> El guardià espera uns segons.</div></div>`;$('#chk').disabled=true;setTimeout(()=>{$('#chk').disabled=false},4000);return}
   tries++;const naive=(f[0]+d);
   const why=Math.abs(v-(f[0]/10+d))<.001&&f[1]!==10?`Sembla que has llegit ${FR(f[0],f[1])} com si fos 0,${f[0]}. Primer passa la fracció a decimal: ${f[0]} ÷ ${f[1]}.`:`Primer passa ${FR(f[0],f[1])} a decimal (${f[0]} ÷ ${f[1]}) i després suma amb les comes una davall l'altra.`;
   $('#fb').innerHTML=`<div class="tip">${OWL(36)}<div><b>La porta no s'obre.</b> ${why} Ara el guardià et posa una altra endevinalla.</div></div><div class="row" style="margin-top:12px;justify-content:center"><button id="nw">Una altra</button></div>`;$('#chk').disabled=true;$('#nw').onclick=nova};
  $('#chk').onclick=go;$('#in').onkeydown=e=>{if(e.key==='Enter')go()};
 }
 nova();
}

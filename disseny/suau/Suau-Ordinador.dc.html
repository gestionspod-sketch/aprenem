<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.sv{font-family:'Poppins',system-ui,sans-serif;color:#1E1B3A}
.sv *{box-sizing:border-box}
.nav a{display:grid;place-items:center;width:52px;height:52px;border-radius:16px;color:#B5B3C4}
.nav a.on{background:#EFEAFE;color:#6E4FE0}
.mode{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:22px;border:0;text-align:left;font:600 15px 'Poppins',sans-serif;color:#1E1B3A;min-height:120px}
.mode i{width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.75);display:grid;place-items:center;font-style:normal}
.mode small{font-weight:400;font-size:12px;color:#5E5B74}
.sub{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:22px;background:#fff}
.sub .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:700}
.bar{height:7px;border-radius:4px;background:#EEF0F5}.bar i{display:block;height:7px;border-radius:4px}
a{color:#6E4FE0}a:hover{color:#1E1B3A}
</style>
</helmet>
<div class="sv" style="width:1280px;height:820px;background:#F1F4F8;display:flex;padding:18px;gap:18px">

<main style="flex:1;min-width:0;display:flex;flex-direction:column;gap:18px;padding:8px 4px">

<div style="flex:1"><div style="font-size:14px;color:#8A879E">Dijous, 20 de novembre</div><div style="font-size:30px;font-weight:600">Hola de nou!</div></div>

</div>
<div style="display:grid;grid-template-columns:1.2fr 1fr;gap:16px">
<div style="background:#FDE3B8;border-radius:28px;padding:26px 28px;display:flex;align-items:center;gap:20px">
<div style="flex:1"><div style="font-size:14px;color:#A0661A">Continua la teva unitat</div><div style="font-size:26px;font-weight:600;color:#5A3A0E;margin-top:2px">Nombres decimals</div><div style="font-size:14px;color:#A0661A;margin-top:4px">Matemàtiques · Unitat 7 · pas 3 de 4</div><button style="margin-top:16px;height:48px;padding:0 26px;border-radius:24px;border:0;background:#F2853A;color:#fff;font:600 15px 'Poppins',sans-serif">Continua</button></div>

</div>
<div style="background:#E3D9FD;border-radius:28px;padding:26px 28px;position:relative;overflow:hidden">
<div style="font-size:14px;color:#6E4FE0">Objectiu d'avui</div>
<div style="font-size:22px;font-weight:600;color:#3B2A8C;max-width:240px;line-height:1.3;margin-top:2px">Et queden 8 minuts per completar-lo</div>
<div style="display:inline-flex;margin-top:14px;background:#4B2FB8;color:#fff;font-size:13px;font-weight:500;padding:7px 14px;border-radius:14px">5 dies seguits!</div>
<svg viewBox="0 0 120 120" width="150" height="150" style="position:absolute;right:4px;bottom:-22px" aria-hidden="true"><ellipse cx="60" cy="72" rx="40" ry="42" fill="#8B6CF0"></ellipse><ellipse cx="60" cy="86" rx="25" ry="24" fill="#EDE6FF"></ellipse><path d="M26 42 34 22 48 36ZM94 42 86 22 72 36Z" fill="#8B6CF0"></path><circle cx="45" cy="56" r="15" fill="#fff"></circle><circle cx="75" cy="56" r="15" fill="#fff"></circle><circle cx="48" cy="55" r="6" fill="#1E1B3A"></circle><circle cx="78" cy="55" r="6" fill="#1E1B3A"></circle><path d="M55 68h10l-5 8Z" fill="#F2853A"></path></svg>
</div>
</div>
<div>

<div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px">
<button class="mode" style="background:#D6E8FD"><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2D6BD8" stroke-width="2"><path d="M2 9 12 4l10 5-10 5ZM6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"></path></svg></i>Professor<small>T'ho explica</small></button>
<button class="mode" style="background:#D4F1E4"><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F8A5B" stroke-width="2"><path d="M3 3h7v7H3ZM14 3h7v7h-7ZM3 14h7v7H3ZM14 17.5h7M17.5 14v7"></path></svg></i>Exercicis<small>Practica un tema</small></button>
<button class="mode" style="background:#FBDDEB"><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C93D78" stroke-width="2"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3ZM9 3v15M15 6v15"></path></svg></i>Aventura<small>Proves amb segell</small></button>
<button class="mode" style="background:#E3D9FD"><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6E4FE0" stroke-width="2"><path d="M12 3 2 8l10 5 10-5ZM2 13l10 5 10-5M2 18l10 5 10-5"></path></svg></i>Sessió mixta<small>Una mica de tot</small></button>
<button class="mode" style="background:#FDE3B8"><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C26A17" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16ZM13 7l4 4"></path></svg></i>Escriptura<small>Escriu i fes foto</small></button>
<button class="mode" style="background:#DDF3C9"><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3E7A1E" stroke-width="2"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18ZM8 12l3 3 5-6"></path></svg></i>Comprovació<small>Ja ho domines?</small></button>
</div>
</div>
<div>

<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px">

<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aprenem">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<meta name="format-detection" content="telephone=no">
<title>Aprenem · v2</title>
<style>
:root{--bg:#F3F5FB;--surface:#fff;--ink:#17203A;--ink2:#3B4560;--muted:#6B7491;--line:#E3E7F1;
 --pri:#4338CA;--pri-h:#4F46E5;--pri-d:#312E81;--pri-l:#EEF0FF;--acc:#F59E0B;--acc-d:#B45309;
 --ok:#059669;--okbg:#E8F8F1;--ko:#E11D48;--kobg:#FFF1F4;--warn:#B45309;--warnbg:#FFF6E5;
 --s-mates:#2563EB;--s-angles:#E11D48;--s-ciencies:#059669;
 --r:20px;--sh:0 1px 2px rgba(23,32,58,.05),0 10px 30px rgba(23,32,58,.07);--sh2:0 2px 4px rgba(23,32,58,.06),0 18px 40px rgba(23,32,58,.12)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Nunito',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:900;letter-spacing:-.015em;line-height:1.2;color:var(--ink)}
h2{font-size:28px}h3{font-size:20px;font-weight:800}
b,strong{font-weight:800}
a{color:var(--pri);font-weight:700}
/* capçalera */
header{display:flex;align-items:center;gap:12px;padding:10px max(16px,calc((100vw - 1000px)/2));background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;user-select:none}
.brand b{font-size:22px;font-weight:900;letter-spacing:-.02em}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--pri-l);color:var(--pri);font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.pill.light{background:rgba(255,255,255,.18);color:#fff}
#timer:not(:empty){font-variant-numeric:tabular-nums;font-weight:800;color:var(--pri);font-size:15px;background:var(--pri-l);padding:7px 14px;border-radius:999px}
main{max-width:1000px;margin:0 auto;padding:24px 16px 48px}
/* elements base */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;margin-bottom:18px;box-shadow:var(--sh)}
.card>h3:first-child{margin-top:0}
button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:12px 22px;background:var(--pri);color:#fff;cursor:pointer;min-height:50px;box-shadow:0 3px 0 var(--pri-d);transition:transform .08s,box-shadow .08s,background .15s;-webkit-tap-highlight-color:transparent}
button:hover{background:var(--pri-h)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--pri-d)}
button.sec{background:var(--pri-l);color:var(--pri);box-shadow:0 3px 0 #D3D8FB}
button.sec:hover{background:#E3E7FF}
button.ghost{background:#fff;color:var(--ink2);border:1.5px solid var(--line);box-shadow:none}
button.ghost:hover{background:#F7F8FC}
button:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.big{font-size:21px;padding:18px 28px;width:100%;border-radius:18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
input,select,textarea{font:inherit;font-weight:600;padding:12px 14px;border:1.5px solid #D5DAE7;border-radius:14px;background:#fff;color:var(--ink);width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 4px rgba(67,56,202,.15)}
input[type=file]{padding:10px;background:var(--bg);border-style:dashed}
input.ans{width:160px;height:66px;font-size:28px;font-weight:900;text-align:center;border-width:2px;border-radius:16px}
label{display:block;margin:14px 0 6px;font-weight:800;font-size:15px;color:var(--ink2)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.muted{color:var(--muted)}
small{display:block;color:var(--muted);font-weight:600;font-size:14px}
/* fitxes i xips */
.tile{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:25px;flex:none;background:color-mix(in srgb,var(--c,var(--pri)) 13%,#fff);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c,var(--pri)) 18%,transparent)}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:999px;background:color-mix(in srgb,var(--c,var(--pri)) 11%,#fff);color:var(--c,var(--pri));font-weight:800;font-size:14px;white-space:nowrap}
.chip.light{background:rgba(255,255,255,.16);color:#fff}
.badge{display:inline-block;padding:3px 11px;border-radius:999px;font-size:13px;font-weight:800;white-space:nowrap}
.b0{background:var(--warnbg);color:var(--warn)}.b1{background:var(--pri-l);color:var(--pri)}.b2{background:var(--okbg);color:var(--ok)}.bn{background:#EEF0F5;color:var(--muted)}
/* portada */
.hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:24px;background:linear-gradient(135deg,#3730A3 0%,#4338CA 45%,#7C3AED 100%);color:#fff;border-radius:28px;padding:36px;margin-bottom:22px;box-shadow:var(--sh2)}
.hero::before,.hero::after{content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.hero::before{width:320px;height:320px;right:-80px;top:-120px}.hero::after{width:180px;height:180px;right:180px;bottom:-110px}
.hero h2{color:#fff;font-size:38px;margin:14px 0 10px}
.hero p{margin:0 0 18px;color:#E0E3FF;font-size:19px;max-width:520px}
.hero-t{flex:1;position:relative;z-index:1}.hero-owl{position:relative;z-index:1;flex:none;filter:drop-shadow(0 12px 20px rgba(0,0,0,.25))}
.role,.mode{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh);transition:transform .15s,box-shadow .15s,border-color .15s}
.role:hover,.mode:hover{background:#fff;transform:translateY(-2px);box-shadow:var(--sh2);border-color:#CFD5F5}
.role:active,.mode:active{transform:translateY(0)}
.role b,.mode b{display:block;font-size:19px;line-height:1.25}
.role .tile{width:60px;height:60px;font-size:30px;border-radius:18px}
.role .arr{margin-left:auto;font-size:22px;color:var(--muted)}
.mode{padding:16px;box-shadow:none}
.mode.sel{border:2px solid var(--pri);background:var(--pri-l);box-shadow:0 0 0 4px rgba(67,56,202,.1)}
.ph{margin:4px 0 20px}.ph h2{margin:0 0 4px}.ph p{margin:0}
/* missió */
.mission{display:flex;gap:28px;align-items:center;padding:28px}
.mission-l{flex:1}.mission-r{display:flex;flex-direction:column;align-items:center;gap:14px;width:240px}
.sk{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.sk:last-child{border-bottom:0}.sk .badge{margin-left:auto}
/* fases */
.stepper{display:flex;align-items:center;flex-wrap:wrap;gap:6px 0;margin-bottom:20px}
.stp{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;color:var(--muted)}
.stp i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#E3E7F1;font-style:normal;font-size:14px}
.stp.on{color:var(--ink)}.stp.on i{background:var(--pri);color:#fff;box-shadow:0 0 0 4px rgba(67,56,202,.15)}
.stp.done i{background:var(--ok);color:#fff}
.stp+.stp::before{content:'';width:28px;height:2px;background:#D5DAE7;margin:0 10px 0 4px;border-radius:2px}
/* exercicis */
.card.subj{border-top:6px solid var(--c,var(--pri))}
.exhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.prob{font-size:28px;font-weight:700;line-height:1.45;margin:10px 0 18px}
.fb{display:block;padding:14px 18px;border-radius:16px;margin-top:14px;font-weight:600;border:1px solid transparent}
.fb.ok{background:var(--okbg);color:#065F46;border-color:#BDEBD8}.fb.ko{background:var(--kobg);color:#9F1239;border-color:#FCCFD9}.fb.warn{background:var(--warnbg);color:#7C2D12;border-color:#FBE0B0}.fb.info{background:var(--pri-l);color:#312E81;border-color:#D8DCFC}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 5px;font-weight:900;line-height:1.15}
.fr>span:first-child{border-bottom:3px solid currentColor;padding:0 5px}
.bar{display:flex;height:52px;border:2px solid #2B3557;border-radius:12px;overflow:hidden;margin:12px 0;max-width:620px;background:#fff}
.bar div{flex:1;border-right:1.5px solid #2B3557;background:#fff;transition:background .12s}
.bar div:last-child{border-right:0}
.bar div.on{background:linear-gradient(180deg,#818CF8,#6366F1)}
.bar.click div{cursor:pointer}.bar.click div:hover{background:#EEF0FF}.bar.click div.on:hover{background:#6366F1}
.dots{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.grp{display:flex;flex-wrap:wrap;gap:4px;padding:8px;border:2px dashed #C9D0E2;border-radius:12px;max-width:116px;background:#fff;transition:all .12s}
.grp.on{background:#EEF0FF;border:2px solid var(--pri)}
.dot{width:12px;height:12px;border-radius:50%;background:#A3AECB;display:inline-block}
.grp.on .dot{background:var(--pri)}
/* aventura */
.adv{position:relative;overflow:hidden;background:radial-gradient(circle at 20% 10%,rgba(255,255,255,.12) 0 2px,transparent 3px),radial-gradient(circle at 80% 30%,rgba(255,255,255,.1) 0 2px,transparent 3px),radial-gradient(circle at 60% 80%,rgba(255,255,255,.08) 0 2px,transparent 3px),linear-gradient(160deg,#1E1B4B 0%,#3730A3 55%,#6D28D9 100%);background-size:180px 180px,220px 220px,160px 160px,100% 100%;color:#fff;border:0}
.adv h3{color:#fff}.adv .muted{color:#C7D2FE}
.advtop{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;color:#C7D2FE;font-size:15px;margin-bottom:14px}
.gems{background:rgba(255,255,255,.14);padding:5px 12px;border-radius:999px;color:#FDE68A}
.path{position:relative;display:flex;justify-content:space-between;margin:6px 0 20px}
.path::before{content:'';position:absolute;left:28px;right:28px;top:50%;border-top:3px dashed rgba(255,255,255,.3)}
.st{position:relative;z-index:1;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:#2E2A6B;border:2px solid rgba(255,255,255,.2);filter:grayscale(1);opacity:.6}
.st.done{filter:none;opacity:1;background:#FEF3C7;border-color:#FCD34D}
.st.cur{filter:none;opacity:1;background:#fff;border-color:#FDE68A;box-shadow:0 0 0 6px rgba(253,230,138,.3);animation:pulse 1.8s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(253,230,138,.08)}}
.advbox{background:#fff;color:var(--ink);border-radius:18px;padding:22px;margin-top:16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
/* mascota */
.owl{display:flex;gap:14px;align-items:flex-start}
.owl .ic{flex:none;line-height:0}
.bub{flex:1;background:var(--pri-l);border-radius:4px 20px 20px 20px;padding:16px 20px}
.bub p:first-child,.bub h3:first-child{margin-top:0}.bub p:last-child{margin-bottom:0}
.steps{padding-left:22px}.steps li{margin:8px 0;padding-left:4px}.steps li::marker{font-weight:900;color:var(--pri)}
/* final */
.ring{--p:0;width:150px;height:150px;border-radius:50%;margin:8px auto 14px;background:conic-gradient(var(--ok) calc(var(--p)*1%),#E3E7F1 0);display:grid;place-items:center}
.ring>div{width:118px;height:118px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:30px;font-weight:900}
/* zona famílies */
.tabs{display:inline-flex;background:#E6E9F4;padding:5px;border-radius:16px;gap:4px;margin-bottom:20px;flex-wrap:wrap}
.tabs button{background:transparent;color:var(--ink2);box-shadow:none;min-height:42px;padding:8px 18px;border-radius:12px}
.tabs button:hover{background:rgba(255,255,255,.6)}
.tabs button.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(23,32,58,.12)}
.subjh{display:flex;align-items:center;gap:10px;margin:18px 0 6px;font-weight:900}
label.chk{display:flex;gap:12px;align-items:center;padding:11px 14px;border:1.5px solid var(--line);border-radius:14px;margin:6px 0;font-weight:700;font-size:16px;color:var(--ink);cursor:pointer;background:#fff;transition:all .12s}
label.chk:hover{border-color:#CFD5F5}
label.chk:has(input:checked){border-color:var(--pri);background:var(--pri-l)}
.chk input{width:20px;height:20px;accent-color:var(--pri);flex:none}
label.chk .badge{margin-left:auto}
.stat{background:var(--bg);border-radius:16px;padding:18px 20px}
.stat b{display:block;font-size:32px;font-weight:900;color:var(--pri);line-height:1.1}
table{width:100%;border-collapse:collapse;font-size:16px}
th{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800}
td,th{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
tr.grp-h th{background:var(--bg);color:var(--ink);font-size:15px;text-transform:none;letter-spacing:0}
.tablewrap{overflow-x:auto}
/* xat */
.chat{max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin:12px 0}
.msg{padding:11px 15px;border-radius:18px;max-width:85%;white-space:pre-wrap;font-weight:600}
.msg.u{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:4px}.msg.m{align-self:flex-start;background:var(--pri-l);border-bottom-left-radius:4px}
.err-dub{color:var(--warn)}.err-ok{color:var(--ok)}
details summary{cursor:pointer}
table.mini{width:auto;min-width:280px;margin:6px 0;background:#fff;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
table.mini th,table.mini td{padding:7px 14px;font-size:16px}
table.mini th{background:var(--bg)}
.bloch{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 0 4px}
.sk.topic .tn{flex:1;min-width:160px}.sk.topic .tb{display:flex;gap:8px;flex-wrap:wrap}.sk.topic .tb button{min-height:44px;padding:8px 14px;font-size:16px}
.subjcard{border-top:5px solid var(--c)}
.lockbtn{position:absolute;top:16px;right:16px;z-index:2;min-height:36px;padding:6px 14px;font-size:14px;font-weight:800;border-radius:999px;background:rgba(255,255,255,.14);color:#E0E3FF;border:1px solid rgba(255,255,255,.25);box-shadow:none}
.lockbtn:hover{background:rgba(255,255,255,.24)}
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(23,32,58,.55);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.modal{background:var(--surface);border-radius:24px;padding:26px;width:100%;max-width:420px;box-shadow:var(--sh2)}
.steps-ai{padding-left:22px;margin:8px 0}.steps-ai li{margin:6px 0}
code.k{background:var(--bg);padding:2px 8px;border-radius:8px;font-weight:800}
table.vt td{font-size:17px}table.vt tr[data-s]{cursor:pointer}table.vt tr:hover td{background:#FAFBFE}table.vt tr.spk td{background:var(--pri-l)}
header{padding-top:max(10px,env(safe-area-inset-top))}
main{padding-bottom:max(48px,env(safe-area-inset-bottom))}
@media (max-width:640px){
 .sk.topic{flex-wrap:wrap}.sk.topic .tb{width:100%}.sk.topic .tb button{flex:1}
 table.vt td,table.vt th{padding:9px 5px;font-size:15px}table.vt th{font-size:11px}
 table.vt .sp,table.vt .rg{display:none}
 .ph .row .ghost{min-height:42px;padding:8px 14px}
}
@media print{header,.noprint,.tabs{display:none!important}body{background:#fff;font-size:13px}main{padding:0;max-width:none}.card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}table.vt td{font-size:13px;padding:4px 8px}h2{font-size:20px}}
@media (max-width:640px){
 body{font-size:17px}main{padding:16px 16px 40px}h2{font-size:24px}
 .hero{padding:26px;flex-direction:column-reverse;align-items:flex-start}.hero h2{font-size:30px}.hero-owl svg{width:96px;height:96px}
 .mission{flex-direction:column;align-items:stretch;padding:22px}.mission-r{width:auto}.mission-r svg{display:none}
 .prob{font-size:23px}.card{padding:18px}.st{width:44px;height:44px;font-size:21px}
 .stp span{display:none}.stp+.stp::before{width:18px}
}
/* ================= v2: estil sobri per a 11-12 anys ================= */
:root{--bg:#F4F5F7;--surface:#fff;--ink:#0F172A;--ink2:#334155;--muted:#64748B;--line:#E2E5EB;
 --pri:#1E3FD0;--pri-h:#1834B2;--pri-d:#142A8F;--pri-l:#EEF1FC;--acc:#D97706;--acc-d:#B45309;
 --ok:#047857;--okbg:#ECF7F2;--ko:#BE123C;--kobg:#FCF0F3;--warn:#B45309;--warnbg:#FDF6EC;
 --s-mates:#1D4ED8;--s-angles:#BE123C;--s-ciencies:#047857;--navy:#121C4D;
 --r:0px;--sh:0 1px 2px rgba(15,23,42,.05);--sh2:0 8px 24px rgba(15,23,42,.10);
 --font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{font-family:var(--font);font-size:17px;line-height:1.55;letter-spacing:-.003em}
h1,h2,h3{font-weight:700;letter-spacing:-.022em}
h2{font-size:28px}h3{font-size:19px;font-weight:650}
b,strong{font-weight:650}
button,input,select,textarea,.card,.tile,.chip,.badge,.fb,.modal,.hero,.advbox,.tabs,.tabs button,label.chk,.stat,.role,.mode,.bub,.msg,table.mini,.bar,.grp,.pill,#timer:not(:empty),.lockbtn,.big,input.ans,.ab{border-radius:0!important}
button{font-weight:600;min-height:46px;padding:11px 20px;box-shadow:none!important;letter-spacing:0;transition:background .12s,border-color .12s,color .12s}
button:active{transform:none}
button.sec{background:var(--pri-l);color:var(--pri);border:1px solid #D5DCF7}
button.sec:hover{background:#E2E8FB}
button.ghost{border:1px solid var(--line)}
.big{font-size:18px;padding:15px 24px}
input,select,textarea{border:1px solid #CBD2DD;font-weight:500}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px rgba(30,63,208,.18)}
input.ans{height:58px;font-size:24px;font-weight:650;border-width:1px;width:170px}
label{font-weight:600;font-size:14px;color:var(--ink2)}
small{font-weight:500}
.card{box-shadow:var(--sh);padding:22px}
.card.subj{border-top:3px solid var(--c,var(--pri))}
.subjcard{border-top:3px solid var(--c)}
.role,.mode{box-shadow:none;border:1px solid var(--line);padding:18px}
.role:hover,.mode:hover{transform:none;box-shadow:inset 3px 0 0 var(--c,var(--pri));border-color:#CFD5E0}
.role b,.mode b{font-size:17px;font-weight:650}
.mode.sel{border:1px solid var(--pri);box-shadow:inset 3px 0 0 var(--pri)}
.tile{width:44px;height:44px;font-size:21px;background:color-mix(in srgb,var(--c,var(--pri)) 9%,#fff);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c,var(--pri)) 22%,transparent);color:var(--c,var(--pri))}
.role .tile{width:48px;height:48px;font-size:22px}
.tile .ab{font-size:17px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ab{display:inline-block;font-weight:700;letter-spacing:-.01em}
.chip .ab,label.chk .ab,.exhead .ab{font-size:.78em;padding:1px 5px;border:1px solid currentColor;line-height:1.3;margin-right:2px}
.chip{border-radius:0;font-weight:600;font-size:13px;padding:5px 10px;text-transform:none}
.badge{font-weight:600;font-size:12px;padding:3px 8px;text-transform:uppercase;letter-spacing:.04em}
.ic{display:inline-block;vertical-align:-.14em;flex:none}
.pill{font-weight:700;font-size:11px;letter-spacing:.08em}
.logo{width:32px;height:32px;display:grid;place-items:center;background:var(--navy);color:#fff;font-weight:800;font-size:18px;letter-spacing:-.03em}
.brand b{font-size:19px;font-weight:700;letter-spacing:-.02em}
#timer:not(:empty){font-weight:600}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#A9B4E8;margin-bottom:4px}
/* franja blava */
.hero{background:var(--navy);background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:32px 32px;box-shadow:none;padding:34px 32px;border-left:6px solid var(--pri)}
.hero::before,.hero::after{display:none}
.hero h2{font-size:34px;font-weight:700;margin:12px 0 8px}
.hero p{color:#C5CCEA;font-size:17px}
.pill.light{background:rgba(255,255,255,.1);color:#DCE2FF}
.lockbtn{border:1px solid rgba(255,255,255,.28);background:transparent;color:#DCE2FF;font-weight:600;min-height:34px;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.lockbtn:hover{background:rgba(255,255,255,.08)}
.mission{padding:24px}
/* fases i exercicis */
.stp i{border-radius:0;font-weight:700}
.prob{font-size:25px;font-weight:600}
.fb{border-radius:0;font-weight:500;border-width:0 0 0 3px;border-style:solid}
.fb.ok{border-color:var(--ok)}.fb.ko{border-color:var(--ko)}.fb.warn{border-color:var(--warn)}.fb.info{border-color:var(--pri)}
.bar{border-width:1px;border-color:#334155}.bar div{border-right-color:#334155}
.bar div.on{background:var(--pri)}
.grp{border-style:solid;border-width:1px;border-color:#CBD2DD}.grp.on{border-color:var(--pri);background:var(--pri-l)}
.owl .ic{line-height:0}
.bub{background:var(--bg);border-left:3px solid var(--pri);padding:14px 18px}
.steps li::marker{font-weight:700}
/* aventura */
.adv{background:var(--navy);background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:28px 28px}
.st{border-radius:0;font-size:16px;font-weight:700;width:44px;height:44px;background:#1C2867;border:1px solid rgba(255,255,255,.2);color:#A9B4E8;filter:none;opacity:1}
.st.done{background:#fff;color:var(--ok);border-color:#fff}
.st.cur{background:var(--pri);color:#fff;border-color:#8FA2F5;box-shadow:0 0 0 4px rgba(143,162,245,.25);animation:none}
.path::before{border-top:1px solid rgba(255,255,255,.25)}
.gems{border-radius:0;background:rgba(255,255,255,.08);color:#FCD34D}
.advbox{box-shadow:none}.advbox .muted{color:var(--muted)}
/* zona famílies */
.tabs{background:transparent;padding:0;gap:0;border-bottom:1px solid var(--line);display:flex}
.tabs button{border-bottom:2px solid transparent;padding:10px 16px;min-height:44px;color:var(--muted)}
.tabs button.on{background:transparent;box-shadow:none;color:var(--ink);border-bottom-color:var(--pri)}
label.chk{border:1px solid var(--line);font-weight:500}
label.chk:has(input:checked){box-shadow:inset 3px 0 0 var(--pri)}
.stat{background:var(--surface);border:1px solid var(--line)}
.stat b{font-weight:700;color:var(--ink)}
.msg.u{border-radius:0}.msg.m{border-radius:0}
.ring>div{font-weight:700}
.modal{border-top:3px solid var(--pri)}
/* rellotge i avisos */
#timer.t-warn{background:var(--warnbg)!important;color:var(--warn)!important}
#timer.t-end{background:var(--kobg)!important;color:var(--ko)!important}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom));z-index:40;width:min(640px,calc(100% - 32px));display:flex;gap:10px;align-items:center;background:var(--navy);color:#fff;padding:12px 12px 12px 18px;box-shadow:var(--sh2);border-left:4px solid var(--acc)}
#toast span{flex:1;font-size:15px}#toast button{min-height:40px;padding:8px 14px;font-size:15px;white-space:nowrap}
#toast .ghost{background:transparent;color:#C5CCEA;border-color:rgba(255,255,255,.25);padding:8px 12px}
/* làmines */
.fig{background:#fff;border:1px solid var(--line);padding:10px;margin:4px 0 16px}
.lamsvg{width:100%;height:auto;max-width:560px;display:block;margin:0 auto;font-family:var(--font)}
.lamsvg .body *{fill:#F6EBE3;stroke:#E2CEBF;stroke-width:1.5}
.lamsvg .face circle{fill:#B89A87}.lamsvg .face .mouth{fill:none;stroke:#B89A87;stroke-width:2;stroke-linecap:round}

.lamsvg .br1{fill:none;stroke:#9E3550;stroke-width:9;stroke-linecap:round}
.lamsvg .br2{fill:none;stroke:#9E3550;stroke-width:4;stroke-linecap:round}
.lamsvg .br3{fill:none;stroke:#B4485F;stroke-width:2;stroke-linecap:round}
.lamsvg .air{fill:#D6E6F8;stroke:#4A78B5;stroke-width:1.5}
.lamsvg .ring{fill:none;stroke:#4A78B5;stroke-width:1.5}
.lamsvg .nose{fill:#E9CFBF;stroke:#B89A87;stroke-width:1.5}
.lamsvg .dia{fill:none;stroke:#B9692C;stroke-width:7;stroke-linecap:round}.lamsvg .dia2{fill:none;stroke:#E2A877;stroke-width:4;stroke-linecap:round}
.lamsvg .inset{fill:#fff;stroke:#C85A6E;stroke-width:2}
.lamsvg .alv{fill:#F6B6C0;stroke:#C85A6E;stroke-width:1.5}
.lamsvg .cap-r{fill:none;stroke:#D63B3B;stroke-width:6;opacity:.75}.lamsvg .cap-b{fill:none;stroke:#3B6FD6;stroke-width:6;opacity:.75}
.lamsvg .ld{stroke:#64748B;stroke-width:1.2}.lamsvg .dash{stroke-dasharray:4 4;fill:none}
.lamsvg .pt{fill:#0F172A}.lamsvg .bd{fill:#121C4D}.lamsvg .bn{fill:#fff;font-size:12px;font-weight:700}
.lamsvg .lt{fill:#0F172A;font-size:15px;font-weight:600}.lamsvg .cap{fill:#64748B;font-size:12px}
.lamsvg [data-part]{cursor:pointer}
.lamsvg .part.hi{filter:drop-shadow(0 0 5px rgba(30,63,208,.9))}
.lamsvg .lab.hi .bd{fill:#1E3FD0}.lamsvg .lab.hi .lt{fill:#1E3FD0;font-weight:700}.lamsvg .lab.hi .ld{stroke:#1E3FD0;stroke-width:2}
.stat span b{display:inline;font-size:inherit;color:inherit;font-weight:700}
.lam{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.lam{grid-template-columns:1fr}}

<body>
<header><div class="brand" onclick="home()"><span class="logo">A</span><b>Aprenem</b><span class="pill">v2</span></div><span id="timer"></span></header>
<main id="app"></main>
<script>
/* ===================== utilitats ===================== */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const lcm=(a,b)=>a/gcd(a,b)*b;
const R=(n,d=1)=>{if(d<0){n=-n;d=-d}const g=gcd(Math.abs(n),d)||1;return{n:n/g,d:d/g}};
const req=(a,b)=>a.n*b.d===b.n*a.d;
const F=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const fmtR=r=>r.d===1?`${r.n}`:`${r.n}/${r.d}`;
const dec=h=>(h/100).toFixed(2).replace('.',',').replace(/,?0+$/,'');
const dec2=h=>(h/100).toFixed(2).replace('.',',');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const once=f=>{let c=false;return(...a)=>{if(!c){c=true;f(...a)}}};
const ORD={1:'1r',2:'2n',3:'3r',4:'4t',5:'5è',6:'6è'};
const mmss=ms=>`${Math.floor(ms/60000)}:${String(Math.floor(ms/1000)%60).padStart(2,'0')}`;
function parseVal(s){
  s=(s||'').trim().replace(/\s+/g,' ');let m;
  if(m=s.match(/^(\d+) (\d+)\s*\/\s*(\d+)$/)){const d=+m[3];return d?R(+m[1]*d+ +m[2],d):null}
  if(m=s.match(/^(-?\d+)\s*\/\s*(\d+)$/))return +m[2]?R(+m[1],+m[2]):null;
  if(m=s.match(/^(-?\d+)(?:[.,](\d+))?$/)){const f=m[2]||'';return R(parseInt(m[1]+f,10),10**f.length)}
  return null;
}
const barHTML=(parts,on,click)=>`<div class="bar${click?' click':''}">${Array.from({length:parts},(_,i)=>`<div class="${i<on?'on':''}" data-i="${i}"></div>`).join('')}</div>`;
const groupsHTML=(d,k,on,click)=>`<div class="dots">${Array.from({length:d},(_,i)=>`<div class="grp${i<on?' on':''}" data-i="${i}" style="${click?'cursor:pointer':''}">${'<span class="dot"></span>'.repeat(k)}</div>`).join('')}</div>`;

/* ===================== habilitats (exercicis verificables) ===================== */
const SK={
 frac_equiv:{nom:'Fraccions equivalents',ic:'🍕',
  teoria:['Dues fraccions són <b>equivalents</b> si representen la mateixa quantitat, encara que s\'escriguin amb nombres diferents.',
   `Per exemple, ${F(1,2)} i ${F(2,4)}: si parteixes una pizza en 2 trossos i en menges 1, menges el mateix que si la parteixes en 4 i en menges 2.`,
   'Per trobar una fracció equivalent <b>multipliquem (o dividim) el numerador i el denominador pel mateix nombre</b>. Mai no sumem!'],
  gen(lv){const b=rnd(2,lv?9:6),a=rnd(1,b-1),k=rnd(2,lv>1?9:5);
   return{text:`Completa la fracció equivalent:<br>${F(a,b)} = ${F('?',b*k)}`,fields:[{label:'Numerador',ans:R(a*k)}],
    vis:barHTML(b,a),
    hints:[`Fixa't en els denominadors: ${b} i ${b*k}. Per quin nombre s'ha multiplicat ${b}?`,`${b} × ${k} = ${b*k}. Ara has de fer el mateix amb el numerador.`],
    steps:[`El denominador ${b} s'ha convertit en ${b*k}, perquè ${b} × ${k} = ${b*k}.`,`Per mantenir la mateixa quantitat, el numerador també es multiplica per ${k}: ${a} × ${k} = ${a*k}.`,`Per tant, ${F(a,b)} = ${F(a*k,b*k)}.`],
    err:v=>v[0].d===1&&v[0].n===a+b*k-b?'suma_no_multiplica':null,
    paint:b*k<=24?{kind:'bar',parts:b*k,target:a*k,label:`Pinta ${F(a,b)} d'aquesta barra. Està dividida en ${b*k} parts iguals.`,
      follow:{q:`Quina fracció de la barra has pintat? Escriu-la amb denominador ${b*k}.`,ans:R(a*k,b*k),raw:`${a*k}/${b*k}`}}:null};
  }},
 frac_suma_igual:{nom:'Sumar i restar fraccions (mateix denominador)',ic:'➕',
  teoria:['Quan les fraccions tenen el <b>mateix denominador</b>, les parts són de la mateixa mida.',
   `Per això només sumem (o restem) els <b>numeradors</b> i deixem el mateix denominador: ${F(2,7)} + ${F(3,7)} = ${F(5,7)}.`,
   'El denominador no se suma: diu en quantes parts està dividida la unitat, i això no canvia.'],
  gen(lv){const den=rnd(3,lv?12:8);let a=rnd(1,den-1),b=rnd(1,den-1);const resta=lv>0&&Math.random()<.5;
   if(resta){if(a===b){if(a===1)a=2;else b--}if(a<b)[a,b]=[b,a]}
   const r=resta?a-b:a+b,op=resta?'−':'+',s=R(r,den);
   return{text:`Calcula:<br>${F(a,den)} ${op} ${F(b,den)}`,fields:[{label:'Resultat (ex. 3/4)',ans:s}],
    vis:barHTML(den,a)+barHTML(den,b),
    hints:['Els denominadors són iguals. Què passa amb el denominador quan sumes o restes?',`El denominador continua sent ${den}. Ara ${resta?'resta':'suma'} només els numeradors.`],
    steps:[`Els dos denominadors són ${den}: el resultat també tindrà denominador ${den}.`,`${resta?'Restem':'Sumem'} els numeradors: ${a} ${op} ${b} = ${r}.`,`Resultat: ${F(r,den)}${s.d!==den&&s.n?` = ${F(s.n,s.d)} (simplificat)`:''}.`],
    err:v=>!resta&&req(v[0],R(a+b,2*den))?'suma_denominadors':null};
  }},
 frac_suma_dif:{nom:'Sumar fraccions (denominador diferent)',ic:'🧮',
  teoria:['Si els denominadors són <b>diferents</b>, les parts tenen mides diferents i no es poden sumar directament.',
   'Primer busquem un <b>denominador comú</b> (el mínim comú múltiple dels denominadors) i convertim cada fracció en una d\'equivalent.',
   `Exemple: ${F(1,2)} + ${F(1,3)} → ${F(3,6)} + ${F(2,6)} = ${F(5,6)}.`],
  gen(lv){const pool=lv?[2,3,4,5,6,8,9,10,12]:[2,3,4,6,8];const b=pick(pool);let e;do{e=pick(pool)}while(e===b);
   const a=rnd(1,b-1),c=rnd(1,e-1),L=lcm(b,e),na=a*L/b,nc=c*L/e,s=R(na+nc,L);
   return{text:`Calcula:<br>${F(a,b)} + ${F(c,e)}`,fields:[{label:'Resultat (ex. 5/6)',ans:s}],
    vis:barHTML(b,a)+barHTML(e,c),
    hints:[`Els denominadors (${b} i ${e}) són diferents. Busca un nombre que sigui múltiple de tots dos.`,`El mínim comú múltiple de ${b} i ${e} és ${L}. Converteix les dues fraccions a denominador ${L}.`],
    steps:[`Busquem el denominador comú: m.c.m.(${b}, ${e}) = ${L}.`,`${F(a,b)} = ${F(na,L)} (multipliquem per ${L/b}) i ${F(c,e)} = ${F(nc,L)} (multipliquem per ${L/e}).`,`${F(na,L)} + ${F(nc,L)} = ${F(na+nc,L)}${s.d!==L?` = ${F(s.n,s.d)} (simplificat)`:''}.`],
    err:v=>req(v[0],R(a+c,b+e))?'suma_denominadors':null};
  }},
 frac_de_nombre:{nom:'Fracció d\'un nombre',ic:'🍬',
  teoria:['Per calcular la fracció d\'un nombre fem dues passes:','1. <b>Dividim</b> el nombre pel denominador (així sabem quant val cada part).','2. <b>Multipliquem</b> el resultat pel numerador (agafem les parts que ens diuen).',`Exemple: ${F(3,4)} de 20 → 20 : 4 = 5 → 5 × 3 = 15.`],
  gen(lv){const d=rnd(2,lv?10:6),n=rnd(1,d-1),k=rnd(2,lv?15:8),N=d*k;
   const text=pick([`Una classe té ${N} alumnes. ${F(n,d)} dels alumnes van d'excursió. Quants alumnes hi van?`,`En Pau té ${N} cromos i en regala ${F(n,d)}. Quants cromos regala?`,`Un dipòsit té ${N} litres d'aigua. Se n'han gastat ${F(n,d)}. Quants litres s'han gastat?`,`Quant és ${F(n,d)} de ${N}?`]);
   return{text,fields:[{label:'Resposta',ans:R(n*k)}],
    vis:N<=80?groupsHTML(d,k,0):null,
    hints:[`En quantes parts iguals has de repartir ${N}? Mira el denominador.`,`${N} : ${d} = ${k}. Cada part val ${k}. Quantes parts has d'agafar?`],
    steps:[`Dividim pel denominador: ${N} : ${d} = ${k}. Cada part val ${k}.`,`Multipliquem pel numerador: ${k} × ${n} = ${n*k}.`,`Resposta: ${n*k}.`],
    err:v=>v[0].d!==1?null:(n!==1&&v[0].n===k?'nomes_divideix':(v[0].n===N*n?'nomes_multiplica':null)),
    paint:N<=60?{kind:'groups',parts:d,k,target:n,label:`Hi ha ${N} punts repartits en ${d} grups iguals. Toca els grups que formen ${F(n,d)} del total.`,
      follow:{q:`Quants punts hi ha als grups que has triat? (és ${F(n,d)} de ${N})`,ans:R(n*k)}}:null};
  }},
 decimals:{nom:'Sumar i restar decimals',ic:'🔢',
  teoria:['En els nombres decimals, la <b>coma</b> separa la part entera de la part decimal.','Per sumar o restar decimals, col·loquem els nombres de manera que les <b>comes quedin alineades</b>: unitats davall unitats, dècimes davall dècimes, centèsimes davall centèsimes.','Si cal, afegim zeros a la dreta: 1,4 = 1,40.'],
  gen(lv){let a=rnd(101,lv?2999:999);if(a%10===0)a++;const bt=rnd(11,lv?199:99),bh=bt*10;let resta=Math.random()<.5;if(resta&&a<=bh)resta=false;
   const r=resta?a-bh:a+bh,op=resta?'−':'+';
   return{text:`Calcula:<br><b>${dec(a)} ${op} ${dec(bh)}</b>`,fields:[{label:'Resultat',ans:R(r,100)}],vis:null,
    hints:['Imagina els nombres un davall l\'altre amb les comes alineades. Quantes xifres decimals té cada un?',`Escriu ${dec(bh)} com ${dec2(bh)} i ${resta?'resta':'suma'} columna per columna.`],
    steps:[`Escrivim ${dec(bh)} com ${dec2(bh)} perquè tots dos tinguin dues xifres decimals.`,`Alineem les comes i ${resta?'restem':'sumem'}: ${dec2(a)} ${op} ${dec2(bh)}.`,`Resultat: ${dec(r)}.`],
    err:v=>req(v[0],R(resta?a-bt:a+bt,100))?'comes_no_alineades':null};
  }},
 divisions:{nom:'Divisions',ic:'➗',
  teoria:['En una divisió hi ha: <b>dividend</b> (el que repartim), <b>divisor</b> (entre quants), <b>quocient</b> (quant toca a cadascú) i <b>residu</b> (el que sobra).','El residu sempre ha de ser <b>més petit que el divisor</b>. Si no, encara en podríem repartir més!','Comprovació: divisor × quocient + residu = dividend.'],
  gen(lv,curs){const dv=curs>=6&&lv>0?rnd(11,29):rnd(3,9),D=rnd(lv?1000:100,lv?9999:999),q=Math.floor(D/dv),r=D%dv;
   return{text:`Fes la divisió:<br><b>${D} : ${dv}</b>`,fields:[{label:'Quocient',ans:R(q)},{label:'Residu',ans:R(r)}],vis:null,
    hints:[`Comença per les primeres xifres de ${D}: quantes vegades hi cap ${dv}?`,`Pots comprovar el resultat: ${dv} × quocient + residu ha de donar ${D}.`],
    steps:[`${dv} × ${q} = ${dv*q}, que és el múltiple de ${dv} més gran que no passa de ${D}.`,`Residu: ${D} − ${dv*q} = ${r} (és més petit que ${dv} ).`,`Comprovació: ${dv} × ${q} + ${r} = ${D}.`],
    err:v=>v[1].d===1&&v[1].n>=dv?'residu_gran':null};
  }},
 percentatges:{nom:'Percentatges',ic:'💯',
  teoria:['El <b>percentatge</b> (%) vol dir «de cada 100». El 25% vol dir 25 de cada 100.',`Un percentatge és una fracció amb denominador 100: 25% = ${F(25,100)} = ${F(1,4)}.`,'Per calcular el p% d\'un nombre: <b>multipliquem pel percentatge i dividim entre 100</b>. Exemple: 20% de 50 → 50 × 20 : 100 = 10.'],
  gen(lv){const p=pick(lv?[5,15,30,40,60,75]:[10,20,25,50]),step=100/gcd(p,100),lo=Math.ceil(20/step),N=step*rnd(lo,lo+(lv?15:8)),ans=p*N/100;
   const text=pick([`Una bicicleta costa ${N} €. Està rebaixada un ${p}%. Quants euros et descompten?`,`En una escola hi ha ${N} alumnes i el ${p}% hi va en bicicleta. Quants alumnes hi van en bicicleta?`,`Calcula el ${p}% de ${N}.`]);
   return{text,fields:[{label:'Resposta',ans:R(ans)}],vis:null,
    hints:[`${p}% vol dir ${p} de cada 100. Com ho escriuries en forma de fracció?`,`Multiplica ${N} × ${p} i després divideix entre 100.`],
    steps:[`${p}% = ${F(p,100)}.`,`${N} × ${p} = ${N*p}.`,`${N*p} : 100 = ${ans}.`],
    err:v=>p!==10&&N%p===0&&v[0].d===1&&v[0].n===N/p?'divideix_percent':null};
  }}
};

/* ===================== ANGLÈS ===================== */
const norm=s=>String(s||'').toLowerCase().replace(/[’`´]/g,"'").replace(/[.,!?;:"«»¿¡]/g,'').replace(/\s+/g,' ').trim();
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}

 ci_ecosis:{mat:'ciencies',nom:'Ecosistemes i cadenes tròfiques',ic:'🦊',
  teoria:['Un <b>ecosistema</b> està format pels éssers vius i el medi on viuen (aigua, terra, clima...).','Una <b>cadena tròfica</b> mostra qui menja qui. La fletxa vol dir «és menjat per»: herba → conill → guilla.','<b>Productors</b>: plantes i algues (fan la fotosíntesi). <b>Consumidors primaris</b>: herbívors que mengen productors. <b>Consumidors secundaris</b>: carnívors que mengen herbívors. <b>Terciaris</b>: mengen altres carnívors. Els <b>descomponedors</b> (fongs i bacteris) transformen les restes en sals minerals.'],
  gen(){const ch=pick(CHAINS),i=rnd(0,ch.length-1),chs=`<b>${ch.join(' → ')}</b>`,role=i===0?'el productor':'el '+ROLES[i][0];
   const paint={kind:'order',items:[...ch].sort(()=>Math.random()-.5),target:ch,label:'Ordena aquesta cadena tròfica: toca primer el <b>productor</b>, després qui se\'l menja, i així successivament.',follow:{q:'Qui és el <b>consumidor primari</b> d\'aquesta cadena?',txt:[ch[1]]}};
   const st=[`La fletxa vol dir «és menjat per». El primer, «${ch[0]}», és el productor.`,`Després venen els consumidors per ordre: primari, secundari${ch.length>3?', terciari':''}.`,`«${ch[i]}» està a la posició ${i+1}: és ${role}.`];
   if(Math.random()<.5)return{text:`Cadena tròfica: ${chs}<br>Quin paper té «${ch[i]}»?`,fields:[{label:'Paper (productor, consumidor...)',txt:ROLES[i],loose:true,wide:true}],vis:null,paint,
    hints:['El primer de la cadena fabrica el seu aliment; els altres són consumidors (primari, secundari...).',i===0?'Fa la fotosíntesi.':`Està a la posició ${i+1}: és el consumidor número ${i}.`],steps:st,
    err:v=>ROLES.some((r,j)=>j!==i&&r.map(fold).includes(fold(v[0])))?'ci_cadena':null};
   return{text:`Cadena tròfica: ${chs}<br>Qui és ${role}?`,fields:[{label:'Ésser viu',txt:[ch[i]],loose:true,wide:true}],vis:null,paint,
    hints:['Recorda: la fletxa vol dir «és menjat per». Compta des del principi.',i===0?'És qui fa la fotosíntesi.':`El consumidor ${['','primari','secundari','terciari'][i]} és a la posició ${i+1}.`],steps:st,
    err:v=>ch.some((x,j)=>j!==i&&fold(x)===fold(v[0]))?'ci_cadena':null};

 ci_materia:{mat:'ciencies',nom:'La matèria i els canvis d\'estat',ic:'🧊',
  teoria:['La matèria pot estar en tres <b>estats</b>: <b>sòlid</b> (té forma pròpia), <b>líquid</b> (s\'adapta al recipient) i <b>gas</b> (ocupa tot l\'espai).','Canvis d\'estat: <b>fusió</b> (sòlid → líquid), <b>solidificació</b> (líquid → sòlid), <b>vaporització</b> (líquid → gas; si és lenta, <b>evaporació</b>), <b>condensació</b> (gas → líquid), <b>sublimació</b> (sòlid → gas).','L\'aigua es congela a <b>0 °C</b> i bull a <b>100 °C</b> (a nivell de la mar).'],
  gen(lv){const r=Math.random();
   if(r<.5){const t=pick(TRANS.filter(x=>lv>0||!x[5])),inv=TRANS.find(x=>x[0]===t[1]&&x[1]===t[0]),ctx=Math.random()<.5;
    return{text:ctx?`${t[4]}.<br>Quin canvi d'estat és?`:`Com es diu el pas de l'estat <b>${t[0]}</b> a l'estat <b>${t[1]}</b>?`,fields:[{label:'Canvi d\'estat',txt:[t[2],...t[3]],loose:true,wide:true}],vis:null,
     hints:[ctx?'De quin estat surt i a quin estat arriba?':'Repassa la llista de canvis d\'estat de la teoria.',`És el pas de ${t[0]} a ${t[1]}. Comença per «${t[2][0].toUpperCase()}».`],
     steps:[`La matèria passa de ${t[0]} a ${t[1]}.`,`Aquest canvi s'anomena <b>${t[2]}</b>.`,...(inv?[`El canvi contrari (de ${inv[0]} a ${inv[1]}) és la ${inv[2]}.`]:[])],
     err:v=>inv&&fold(v[0])===fold(inv[2])?'ci_canvis':null}}
   if(r<.8){const[x,e]=pick(ESTATS),why=e==='sòlid'?'té forma pròpia':e==='líquid'?'no té forma pròpia: s\'adapta al recipient':'ocupa tot l\'espai disponible';
    return{text:`En quin estat es troba ${x} a temperatura ambient?`,fields:[{label:'Estat',txt:e==='gas'?['gas','gasós']:[e],loose:true}],vis:null,
     hints:['Té forma pròpia? S\'adapta al recipient? Ocupa tot l\'espai?',`Comença per «${e[0].toUpperCase()}».`],steps:[`${cap(x)} ${why}.`,`Per tant, està en estat <b>${e}</b>.`]}}
   const bull=Math.random()<.5;
   return{text:`A quants graus centígrads ${bull?'bull':'es congela'} l'aigua (a nivell de la mar)?`,fields:[{label:'Graus (°C)',txt:[bull?'100':'0'],loose:true}],vis:null,
    hints:[bull?'És un nombre rodó i força alt.':'És el nombre més petit que no és negatiu.',bull?'Té tres xifres.':'Té una sola xifra.'],
    steps:[bull?'L\'aigua passa de líquid a gas (bull) a <b>100 °C</b>.':'L\'aigua passa de líquid a sòlid (es congela) a <b>0 °C</b>.','Recorda: 0 °C → gel · 100 °C → bull.']}
  }},

 if(c.length>=3&&c.reduce((a,b)=>a+b,0)/c.length>=.75&&p.sense>=3)return 2;

 t.textContent=show?mmss(Math.max(0,left))+(pl!=null?` · fase ${mmss(Math.max(0,pl))}`:''):'';
 t.className=show?(ref<=0?'t-end':ref<=60000?'t-warn':''):'';
 if(pl!=null&&pl<=0&&PHASE_NEXT&&!PH_DUE){PH_DUE=true;toast(`S'ha acabat el temps d'aquesta part. Quan acabis l'exercici, passarem a <b>${MODES[PH[CURPI+1][0]].nom}</b>.`,'Passar ara',nextPhaseNow)}
 else if(left<=0&&!TIME_TOLD&&!PHASE_NEXT){TIME_TOLD=true;toast('S\'ha acabat el temps de la sessió. Pots acabar l\'exercici que estàs fent.','Acabar ara',()=>{hideToast();finish()})}

function plain(h){return String(h).replace(/<span class="fr"><span>([^<]*)<\/span><span>([^<]*)<\/span><\/span>/g,' $1 sobre $2 ').replace(/<br>/g,'. ').replace(/<[^>]+>/g,'').replace(/×/g,' per ').replace(/−/g,' menys ').replace(/ : /g,' entre ').replace(/\s+/g,' ').trim()}
function say(t,rate=.9,lang='ca-ES'){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(plain(t));u.lang=lang;u.rate=rate;const vs=speechSynthesis.getVoices(),v=vs.find(v=>v.lang.replace('_','-')===lang)||vs.find(v=>v.lang.slice(0,2)===lang.slice(0,2));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
try{speechSynthesis.getVoices()}catch(e){}
const SRc=()=>window.SpeechRecognition||window.webkitSpeechRecognition;
const micBtn=id=>SRc()?`<button class="sec" type="button" onclick="dictate('${id}',this)">Dictar</button>`:'';
function dictate(id,btn){const SR=SRc();if(!SR)return;const r=new SR();r.lang='ca-ES';r.interimResults=false;btn.textContent='Escoltant...';
 r.onresult=e=>{const t=e.results[0][0].transcript,ta=document.getElementById(id);ta.value=(ta.value?ta.value+' ':'')+t};
 r.onend=r.onerror=()=>btn.textContent='Dictar';r.start()}

async function gemini(contents,{json=false,system=''}={}){
 if(!S.cfg.key)throw new Error('La IA no està activada. Els pares la poden activar a Zona famílies → Configuració.');
 const body={contents,generationConfig:{temperature:.4}};
 if(json)body.generationConfig.responseMimeType='application/json';
 if(system)body.systemInstruction={parts:[{text:system}]};
 const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(S.cfg.model)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':S.cfg.key},body:JSON.stringify(body)});
 const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error?.message||('Error '+r.status));
 return(d.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
}
const parseJSON=t=>JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1));
function fileToPart(f){return new Promise((res,rej)=>{const rd=new FileReader();rd.onerror=rej;rd.onload=()=>{const url=rd.result;
 if(!f.type.startsWith('image/'))return res({inline_data:{mime_type:f.type||'application/pdf',data:url.split(',')[1]}});
 const im=new Image();im.onload=()=>{const s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res({inline_data:{mime_type:'image/jpeg',data:c.toDataURL('image/jpeg',.85).split(',')[1]}})};
 im.onerror=()=>res({inline_data:{mime_type:f.type,data:url.split(',')[1]}});im.src=url};rd.readAsDataURL(f)})}

// mode: 'prac' (pistes), 'adv' (pistes), 'seal' (sense pistes), 'chk' (sense pistes, un intent)
function exercise(el,k,o){
 let p,t0,wrong,hints,lock=false;const help=o.mode==='prac'||o.mode==='adv';
 const fresh=variant=>{p=genP(k);t0=Date.now();wrong=0;hints=0;lock=false;
  el.innerHTML=`${variant?'<div class="fb info">Mateixa idea, dades noves. Ara demostra que ho has entès!</div>':''}
  <div class="prob">${p.text}</div>${p.fig?`<div class="fig">${p.fig}</div>`:''}<div class="vis">${o.showVis&&p.vis?p.vis:''}</div>
  <div class="row">${p.fields.map((f,i)=>`<div style="${f.wide?'flex:1;min-width:240px':''}"><label>${f.label}</label><input class="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-i="${i}" style="${f.wide?'width:100%;font-size:22px':f.txt?'width:240px':''}"></div>`).join('')}</div>
  <div class="row" style="margin-top:14px"><button class="okb">Comprova</button>${help?'<button class="sec hb">Pista</button>':''}<button class="${p.listen?'sec':'ghost'} sp" title="Escolta"><svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9Z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>${p.listen?' Escolta':''}</button></div><div class="fbx"></div>`;
  const ins=el.querySelectorAll('input.ans');ins.forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')check()});if(!p.fig)ins[0].focus({preventScroll:true});
  const speak=()=>p.listen?say(p.listen,.8,'en-GB'):say(p.text);
  el.querySelector('.okb').onclick=check;if(help)el.querySelector('.hb').onclick=hint;el.querySelector('.sp').onclick=speak;
  if(p.listen)setTimeout(speak,400);
 };
 const lockAll=()=>{el.querySelectorAll('input.ans,.okb,.hb').forEach(x=>x.disabled=true)};
 function hint(){hints++;if(p.vis)el.querySelector('.vis').innerHTML=p.vis;const h=p.hints[hints-1];
  el.querySelector('.fbx').innerHTML=`<div class="fb info">${h||'Ja no queden més pistes. Llegeix-les una altra vegada i prova-ho!'}</div>`}
 function check(){if(lock)return;
  const ins=[...el.querySelectorAll('input.ans')],raw=ins.map(i=>i.value.trim()),v=raw.map((r,i)=>p.fields[i].txt?(norm(r)||null):parseVal(r)),fb=el.querySelector('.fbx');
  if(v.some(x=>!x)){fb.innerHTML=p.fields[0].txt?'<div class="fb warn">Escriu la resposta.</div>':'<div class="fb warn">Escriu un nombre o una fracció (per exemple <b>12</b>, <b>3/4</b> o <b>2,5</b>).</div>';return}
  const dt=Date.now()-t0;
  const notes=[];
  const match=(f,x)=>{if(!f.txt)return req(f.ans,x);if(f.txt.includes(x))return true;if(!f.loose)return false;
   const fx=fold(x),hit=f.txt.find(t=>fold(t)===fx);
   if(hit){if(art(norm(hit))!==art(x))notes.push(`Compte amb l'ortografia: s'escriu «${esc(hit)}».`);return true}
   const near=fx.length>=7&&f.txt.find(t=>lev(fold(t),fx)<=1);
   if(near){notes.push(`Ho has entès! Però compte amb l'ortografia: s'escriu «${esc(near)}».`);return true}return false};
  if(p.fields.every((f,i)=>match(f,v[i]))){
   const used=hints>0||wrong>0;record(k,true,used,o.mode==='chk');lockAll();
   let note=notes.length?' '+notes.join(' '):'';p.fields.forEach((f,i)=>{if(!f.txt&&raw[i].includes('/')&&raw[i].replace(/\s/g,'')!==fmtR(f.ans))note=` Es pot simplificar: <b>${fmtR(f.ans)}</b>.`});
   fb.innerHTML=`<div class="fb ok">${pick(['Molt bé!','Correcte!','Genial!','Ho has clavat!','Well done!'])}${used?' (amb ajuda)':''}${note}</div><div class="row" style="margin-top:10px"><button class="nx">Continuar →</button>${p.pron?'<button class="sec pr"><svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9Z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg> Escolta com es pronuncia</button>':''}</div>`;
   if(p.pron)fb.querySelector('.pr').onclick=()=>say(p.pron,.8,'en-GB');
   const nb=fb.querySelector('.nx');nb.focus();nb.onclick=goOn(()=>o.onDone({ok:true,help:used,p}));return;
  }
  wrong++;const et=p.err?p.err(v):null;if(et)recErr(k,et);
  if(o.mode==='chk'){record(k,false,false,true);lockAll();
   fb.innerHTML=`<div class="fb ko">No és correcte. La resposta era <b>${p.fields.map(ansStr).join(' i ')}</b>. Ho repassarem!</div><button class="nx" style="margin-top:10px">Continuar →</button>`;
   fb.querySelector('.nx').onclick=goOn(()=>o.onDone({ok:false,p}));return;
  }
  if(dt<3500&&wrong===1){recErr(k,'massa_rapid');lock=true;let s=6;
   const upd=()=>fb.innerHTML=`<div class="fb warn">Has respost molt de pressa. Llegeix l'enunciat amb calma i pensa abans de respondre. (${s})</div>`;upd();
   const iv=setInterval(()=>{s--;if(s<=0){clearInterval(iv);lock=false;t0=Date.now()-5000;fb.innerHTML='<div class="fb info">Ara sí: pensa-ho bé i torna-ho a provar.</div>'}else upd()},1000);return;
  }
  if(wrong>=2){record(k,false,true,false);lockAll();guided(fb,p.steps,()=>fresh(true));return}
  fb.innerHTML=`<div class="fb ko">${et?ERR[et].kid:pick([p.fields[0].txt?'Encara no és correcte. Revisa la resposta.':'Encara no és correcte. Revisa els càlculs.','Gairebé! Torna-ho a mirar amb calma.'])}${help?' Si vols, demana una pista.':''}</div>`;
  t0=Date.now();
 }
 fresh(false);
}

function manip(el,k,onDone){
 let p;for(let t=0;t<12&&!(p&&p.paint);t++)p=genP(k);
 if(!p.paint)return exercise(el,k,{mode:'prac',showVis:true,onDone});
 const P=p.paint,sel=new Set(),seq=[],ord=P.kind==='order';let wrong=0;
 el.innerHTML=`<p class="muted">${ord?'Pensa primer qui menja qui. Després toca-ho per ordre.':'Primer calcula quantes en necessites. Després toca-les.'}</p><div class="prob" style="font-size:22px">${P.label}</div>
  <div class="mz">${ord?`<div class="row">${P.items.map((x,i)=>`<button class="sec" data-i="${i}">${esc(x)}</button>`).join('')}</div><p class="seq" style="font-size:22px;min-height:34px;font-weight:700"></p><button class="ghost clr">↺ Torna a començar</button>`:P.kind==='bar'?barHTML(P.parts,0,true):groupsHTML(P.parts,P.k,0,true)}</div>
  ${ord?'':'<p class="muted">Seleccionats: <b class="cnt">0</b></p>'}<button class="okb" style="margin-top:10px">Comprova</button><div class="fbx"></div>`;
 const showSeq=()=>el.querySelector('.seq').textContent=seq.map(i=>P.items[i]).join(' → ');
 el.querySelectorAll('.mz [data-i]').forEach(d=>d.onclick=()=>{if(el.querySelector('.okb').disabled)return;const i=+d.dataset.i;
  if(ord){if(seq.includes(i))return;seq.push(i);d.disabled=true;showSeq();return}
  sel.has(i)?sel.delete(i):sel.add(i);d.classList.toggle('on');el.querySelector('.cnt').textContent=sel.size});
 if(ord)el.querySelector('.clr').onclick=()=>{if(el.querySelector('.okb').disabled)return;seq.length=0;el.querySelectorAll('.mz [data-i]').forEach(b=>b.disabled=false);showSeq()};
 el.querySelector('.okb').onclick=()=>{const fb=el.querySelector('.fbx');

   fb.innerHTML=`<div class="fb ok">Molt bé!</div><label>${P.follow.q}</label><div class="row"><input class="ans fa" autocomplete="off"><button class="fok">Comprova</button></div><div class="fb2"></div>`;
   const fa=fb.querySelector('.fa');fa.focus();
   const go=()=>{const v=fa.value.replace(/\s/g,''),pv=parseVal(v),f2=fb.querySelector('.fb2');
    const ok=P.follow.txt?P.follow.txt.map(fold).includes(fold(fa.value)):P.follow.raw?v===P.follow.raw:(pv&&req(pv,P.follow.ans));
    if(ok){record(k,true,wrong>0);f2.innerHTML='<div class="fb ok">Perfecte!</div><button class="nx" style="margin-top:10px">Continuar →</button>';f2.querySelector('.nx').onclick=goOn(onDone)}
    else if(P.follow.raw&&pv&&req(pv,P.follow.ans))f2.innerHTML='<div class="fb warn">És equivalent, però escriu-la amb el denominador que et demanem.</div>';

   fb.querySelector('.fok').onclick=go;fa.onkeydown=e=>{if(e.key==='Enter')go()};

   if(wrong>=2){record(k,false,true);el.querySelector('.okb').disabled=true;guided(fb,p.steps,()=>manip(el,k,onDone))}
   else fb.innerHTML=`<div class="fb ko">No és correcte. No provis a l'atzar: ${ord?'pensa qui fabrica el seu aliment i qui se\'l menja.':'calcula quantes parts necessites i després selecciona-les.'}</div>`;
  }};
}

let PARENT_OK=false;
const pinHash=p=>{let h=5381;for(const c of 'aprenem:'+p)h=((h<<5)+h+c.charCodeAt(0))>>>0;return h.toString(36)};

const pinInput=(id,ph)=>`<input id="${id}" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" placeholder="${ph}" style="font-size:26px;text-align:center;letter-spacing:.3em;margin-top:6px">`;
function askPin(){
 if(!S.pin){modal(`<h3 style="margin-top:0"><svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="11" width="16" height="10"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg> Crea el PIN de la família</h3><p class="muted" style="margin-top:0">La primera vegada, triau un PIN de 4 xifres. El demanarem cada vegada que entreu a la zona de famílies, perquè els infants no la puguin obrir.</p>

  const go=()=>{const a=$('#p1').value.trim(),b=$('#p2').value.trim();
   if(!/^\d{4,8}$/.test(a)){$('#pm').innerHTML='<div class="fb warn">El PIN ha de tenir entre 4 i 8 xifres.</div>';return}
   if(a!==b){$('#pm').innerHTML='<div class="fb warn">Els dos PIN no coincideixen. Torna-ho a provar.</div>';return}
   S.pin=pinHash(a);save();closeModal();PARENT_OK=true;parent('sessio')};
  $('#pok').onclick=go;$('#p2').onkeydown=e=>{if(e.key==='Enter')go()};return}
 modal(`<h3 style="margin-top:0"><svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="11" width="16" height="10"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg> Zona de famílies</h3><p class="muted" style="margin-top:0">Escriviu el PIN per entrar.</p>${pinInput('p1','••••')}<div id="pm"></div>
  <div class="row" style="margin-top:16px;justify-content:space-between;align-items:center"><button class="ghost" id="pfg" style="min-height:42px;padding:8px 12px;font-size:15px">He oblidat el PIN</button><span class="row"><button class="ghost" onclick="closeModal()">Cancel·lar</button><button id="pok">Entrar</button></span></div>`);
 const go=()=>{if(pinHash($('#p1').value.trim())===S.pin){closeModal();PARENT_OK=true;parent('sessio')}else{$('#pm').innerHTML='<div class="fb ko">PIN incorrecte.</div>';$('#p1').value='';$('#p1').focus()}};
 $('#pok').onclick=go;$('#p1').onkeydown=e=>{if(e.key==='Enter')go()};
 $('#pfg').onclick=()=>{const a=rnd(23,89),b=rnd(23,89);
  modal(`<h3 style="margin-top:0">He oblidat el PIN</h3><p class="muted" style="margin-top:0">Per crear-ne un de nou, resoleu aquesta operació. No s'esborra cap dada de progrés.</p><p style="font-size:26px;font-weight:900;text-align:center">${a} × ${b} = ?</p><input id="p1" inputmode="numeric" style="font-size:24px;text-align:center"><div id="pm"></div>
   <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="ghost" onclick="closeModal()">Cancel·lar</button><button id="pok">Comprovar</button></div>`);
  $('#pok').onclick=()=>{if(+$('#p1').value.trim()===a*b){S.pin='';save();askPin()}else $('#pm').innerHTML='<div class="fb ko">No és correcte.</div>'}}
}

function temari(forParent,el){const T=TEMARI.angles,c=+S.perfil.curs>=6?6:5;
 const html=`${forParent?'':`<div class="row ph" style="justify-content:space-between;align-items:flex-end"><div><h2>Temari d'anglès</h2><p class="muted">Què s'aprèn a 5è i 6è de Primària.</p></div><button class="ghost" onclick="kid()">← Tornar</button></div>`}
 <div class="fb info" style="margin:0 0 18px">Temari orientatiu basat en els continguts habituals d'anglès del 3r cicle de Primària. Comprovau-lo amb el llibre i la programació de l'escola: amb fotos del llibre, la IA ajusta la sessió al que fa a classe.</div>
 ${[5,6].map(n=>`<div class="card subj" style="--c:var(--s-angles)"><div class="exhead"><h3 style="margin:0">${ORD[n]} de Primària</h3>${n===c?'<span class="chip" style="--c:var(--s-angles)">El teu curs</span>':''}</div>
  ${T[n].map(([t,sk])=>`<div class="sk"><span class="tile" style="--c:var(--s-angles);width:40px;height:40px;font-size:18px">${sk.length?IC.check:'<span class="muted">–</span>'}</span><span style="flex:1"><b style="font-weight:700">${t}</b><small>${sk.length?sk.map(k=>SK[k].nom).join(' · '):'Exercicis properament'}</small></span>
  ${sk.length?(forParent?`<button class="sec" data-add="${sk.join(',')}" style="min-height:42px;padding:8px 14px">+ Sessió</button>`:`<button class="sec" data-pr="${sk.join(',')}" style="min-height:42px;padding:8px 14px">Practicar</button>`):''}</div>`).join('')}</div>`).join('')}`;
 if(forParent){el.innerHTML=html+'<p class="muted" id="tmok"></p>'}else app(html);
 document.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>start('exercicis',b.dataset.pr.split(','),15));
 document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const sk=b.dataset.add.split(',');S.sessio.skills=[...new Set([...S.sessio.skills,...sk])];save();b.textContent='Afegit';b.disabled=true;$('#tmok').textContent='Temes afegits a la sessió d\'avui. Revisau-la a la pestanya «Sessió d\'avui».'});
}

const PH=[['professor',.15],['aventura',.4],['exercicis',.25],['comprovacio',.2]];
function start(mode,ovSkills,ovMin){const skills=ovSkills||S.sessio.skills,min=ovMin||S.sessio.minuts;
 if(!skills.length&&mode!=='escriptura'){app(`<div class="card" style="text-align:center;max-width:560px;margin:0 auto">${OWL(80)}<h3>Encara no hi ha cap tema triat</h3><p class="muted">Els pares han de triar almenys un tema a la Zona famílies, o pots entrar a una assignatura des de l'inici.</p><button onclick="home()">Tornar a l'inici</button></div>`);return}
 CUR={t0:Date.now(),fin:Date.now()+min*60000,tot:0,ok:0,mode,skills:skills.slice()};phaseEnd=0;
 TIME_TOLD=false;
 if(mode==='combinada')return phase(0);
 runMode(mode,null,finish);
}
function phase(i){if(i>=PH.length)return finish();phaseEnd=Date.now()+S.sessio.minuts*PH[i][1]*60000;runMode(PH[i][0],i,()=>phase(i+1))}
function runMode(mode,pi,done){done=once(done);hideToast();CURPI=pi;PH_DUE=false;PHASE_NEXT=pi!=null&&pi<PH.length-1?done:null;
 app(`${pi!=null?`<div class="stepper">${PH.map((p,j)=>`<div class="stp ${j===pi?'on':j<pi?'done':''}"><i>${j<pi?'✓':j+1}</i><span>${MODES[p[0]].nom}</span></div>`).join('')}</div>`:''}
 <div class="row ph" style="justify-content:space-between;align-items:center"><div class="row" style="align-items:center;gap:12px"><span class="tile">${MODES[mode].ic}</span><h2 style="margin:0">${MODES[mode].nom}</h2></div><button class="ghost" id="skip">${pi!=null&&pi<PH.length-1?'Següent fase →':'Acabar'}</button></div><div id="stage"></div>`);
 $('#skip').onclick=done;
 ({professor:mProf,aventura:mAdv,exercicis:mEx,comprovacio:mChk,escriptura:mWrite})[mode]($('#stage'),done);
}
function finish(){const c=CUR;endSession();

    vocab:Array.isArray(j.vocabulari)&&j.vocabulari.length?j.vocabulari.filter(w=>w.en&&w.ca).map(w=>({en:String(w.en).trim(),ca:String(w.ca).trim(),em:w.emoji||''})):S.sessio.vocab,resum:(j.resum_pares||'')+(j.fora_abast?' '+j.fora_abast:'')};

function pProg(el){const log=S.log,tot=log.reduce((a,b)=>a+b.min,0),wk=log.filter(l=>Date.now()-new Date(l.data)<7*864e5).reduce((a,b)=>a+b.min,0);
 const errs=[];for(const[k,p]of Object.entries(S.prog))for(const[t,n]of Object.entries(p.errs))if(ERR[t]&&SK[k])errs.push({k,t,n});errs.sort((a,b)=>b.n-a.n);
 const stat=(v,l)=>`<div class="stat"><b>${v}</b><span class="muted">${l}</span></div>`;
 el.innerHTML=`<div class="card"><h3 style="margin-top:0">Resum${S.perfil.nom?' de '+esc(S.perfil.nom):''}</h3><div class="grid">${stat(Math.round(wk)+' min','aquesta setmana')}${stat(log.length,'sessions')}${stat(Math.round(tot)+' min','en total')}</div></div>

 <p class="muted" style="font-size:14px"><b>En procés:</b> necessita ajuda o explicacions. <b>Comprèn:</b> resol exercicis sense pistes. <b>Domina:</b> supera la comprovació amb exercicis nous i sense ajuda.</p></div>
 <div class="card"><h3 style="margin-top:0">Errors habituals</h3>${errs.length?'<ul>'+errs.slice(0,6).map(e=>`<li>${ERR[e.t].par} <span class="muted">(${SK[e.k].nom}, ${e.n} ${e.n>1?'vegades':'vegada'})</span></li>`).join('')+'</ul>':'<p class="muted">Encara no hi ha dades.</p>'}</div>
 <div class="card"><h3 style="margin-top:0">Com explica el que fa</h3>${S.just.slice(-5).reverse().map(j=>`<p>«${esc(j.text)}» <span class="muted">— ${SK[j.k]?.nom||''}${j.ia?' · IA: '+esc(j.ia):''}</span></p>`).join('')||'<p class="muted">Les explicacions que escrigui durant l\'aventura apareixeran aquí.</p>'}</div>
 <div class="card"><h3 style="margin-top:0">Escriptura a mà</h3>${S.escrit.slice(-5).reverse().map(w=>`<p><b>${new Date(w.data).toLocaleDateString('ca')}</b> · ${w.tipus}: ${w.errors.length} errors (${w.errors.filter(e=>e.confianca==='dubtosa').length} dubtosos)${w.errors.length?' — '+w.errors.slice(0,4).map(e=>esc(e.escrit+' → '+e.correcte)).join(', '):''}</p>`).join('')||'<p class="muted">Encara no hi ha dades.</p>'}</div>
 <div class="card"><h3 style="margin-top:0">Recomanació per a la propera sessió</h3><p>${recom().text}</p></div>
 <div class="card"><h3 style="margin-top:0">Darreres sessions</h3>${log.length?`<div class="tablewrap"><table><tr><th>Data</th><th>Minuts</th><th>Mode</th><th>Encerts</th></tr>${log.slice(-8).reverse().map(l=>`<tr><td>${new Date(l.data).toLocaleString('ca',{dateStyle:'short',timeStyle:'short'})}</td><td>${l.min}</td><td>${MODES[l.mode]?.ic||''} ${MODES[l.mode]?.nom||l.mode}</td><td>${l.ok}/${l.tot}</td></tr>`).join('')}</table></div>`:'<p class="muted">Encara no hi ha sessions.</p>'}</div>
 <button class="ghost" id="rs">Esborrar tot el progrés</button>`;
 let arm=false;$('#rs').onclick=()=>{if(!arm){arm=true;$('#rs').textContent='Segur? Torna a pitjar per esborrar-ho tot (no es pot desfer)';$('#rs').style.color='var(--ko)';return}S.prog={};S.log=[];S.just=[];S.escrit=[];save();parent('prog')}}

 teoria:['Respiram per agafar <b>oxigen</b> de l\'aire, que les cèl·lules necessiten per obtenir energia, i per expulsar el <b>diòxid de carboni</b>, que és un residu.','Camí de l\'aire: <b>fosses nasals → faringe → laringe → tràquea → bronquis → bronquíols → alvèols</b>, dins els <b>pulmons</b>.','La respiració té dues fases: la <b>inspiració</b> (el diafragma baixa i l\'aire entra) i l\'<b>espiració</b> (el diafragma puja i l\'aire surt). Mira la làmina:'],
 gen(lv){const ids=Object.keys(RESP).filter(id=>lv>0||!RESP[id].lv);
  const err=(id)=>v=>Object.entries(RESP).some(([o,r])=>o!==id&&r.a.split('|').map(fold).includes(fold(v[0])))?'ci_organs':null;
  if(lv>0&&Math.random()<.2){const ins=Math.random()<.5;return{text:`Com es diu la fase de la respiració en què l'aire ${ins?'<b>entra</b> als':'<b>surt</b> dels'} pulmons?`,fields:[{label:'Fase',txt:[ins?'inspiració':'espiració'],loose:true,wide:true}],vis:null,
   hints:['Pensa en el diafragma: baixa o puja?',`Comença per «${ins?'I':'E'}».`],steps:[ins?'Quan el diafragma es contreu i baixa, els pulmons s\'omplen d\'aire.':'Quan el diafragma es relaxa i puja, l\'aire surt dels pulmons.',`Aquesta fase és l'<b>${ins?'inspiració':'espiració'}</b>.`]}}
  if(Math.random()<.65){const id=pick(ids),r=RESP[id];
   return{text:`Observa la làmina. Com es diu la part número <b>${r.n}</b>?`,fig:respSVG({mode:'numbers',hi:id}),fields:[{label:'Nom de la part',txt:r.a.split('|'),loose:true,wide:true}],vis:null,
    hints:[`Pista: ${r.f.replace(new RegExp(r.nom,'gi'),'…')}`,`Comença per «${r.nom[0]}» i té ${[...r.nom.replace(/ /g,'')].length} lletres.`],
    steps:[`El número ${r.n} és: <b>${r.nom}</b>.`,r.f],err:err(id)}}
  const[q,id]=pick(RESP_Q.filter(x=>ids.includes(x[1]))),r=RESP[id];
  return{text:`Quina part de l'aparell respiratori ${q}?`,fields:[{label:'Part',txt:r.a.split('|'),loose:true,wide:true}],vis:null,
   hints:['Recorda el camí de l\'aire: nas, faringe, laringe, tràquea, bronquis, bronquíols, alvèols.',`Comença per «${r.nom[0]}».`],steps:[`És ${/s$/.test(r.nom)?'els':'la'} <b>${r.nom}</b>.`,r.f],err:err(id)}}};
function lamina(){endSession();let mode='labels',hi=null;
 app(`<div class="row ph" style="justify-content:space-between;align-items:flex-end"><div><div class="eyebrow" style="color:var(--s-ciencies)">Làmina · Ciències naturals</div><h2>L'aparell respiratori</h2><p class="muted">Toca cada part del dibuix per saber què fa.</p></div><button class="ghost" onclick="subject('ciencies')">← Tornar</button></div>
 <div class="lam"><div class="card lam-fig"><div class="tabs" style="margin:0 0 12px"><button id="lm1" class="on">Amb noms</button><button id="lm2">Sense noms (posa't a prova)</button></div><div id="lsvg"></div></div>
 <div><div class="card" id="linfo"></div>
 <div class="card"><h3>Com respiram?</h3><div class="grid" style="grid-template-columns:1fr 1fr"><div class="stat"><b style="font-size:16px;color:var(--s-ciencies)">Inspiració</b><span>El diafragma es contreu i <b>baixa</b>. Els pulmons s'eixamplen i l'aire <b>entra</b>.</span></div><div class="stat"><b style="font-size:16px;color:var(--s-ciencies)">Espiració</b><span>El diafragma es relaxa i <b>puja</b>. Els pulmons es fan petits i l'aire <b>surt</b>.</span></div></div>
 <p style="margin-bottom:0">Als <b>alvèols</b>, l'oxigen (<span style="color:#D63B3B;font-weight:700">sang vermella</span>) passa a la sang, i el diòxid de carboni (<span style="color:#3B6FD6;font-weight:700">sang blava</span>) en surt.</p></div>
 <div class="row"><button id="la">Aprendre el tema</button><button class="sec" id="lp">Practicar amb la làmina</button></div></div></div>`);
 const info=()=>{const ids=Object.keys(RESP);$('#linfo').innerHTML=hi?`<div class="eyebrow" style="color:var(--s-ciencies)">Part ${RESP[hi].n} de ${ids.length}</div><h3 style="margin:4px 0 8px">${mode==='labels'?RESP[hi].nom:'Quina part és?'}</h3><p style="margin:0">${mode==='labels'?RESP[hi].f:'Mode prova: digues el nom en veu alta i després canvia a «Amb noms» per comprovar-ho.'}</p>`
  :`<h3 style="margin-top:0">El camí de l'aire</h3><ol class="steps" style="margin:0">${ids.map(id=>`<li><a href="#" data-go="${id}">${RESP[id].nom}</a></li>`).join('')}</ol>`;
  $('#linfo').querySelectorAll('[data-go]').forEach(a=>a.onclick=e=>{e.preventDefault();hi=a.dataset.go;draw()})};
 const draw=()=>{$('#lsvg').innerHTML=respSVG({mode,hi});$('#lsvg').querySelectorAll('[data-part]').forEach(g=>g.onclick=()=>{hi=g.dataset.part;draw()});info()};
 $('#lm1').onclick=()=>{mode='labels';$('#lm1').className='on';$('#lm2').className='';draw()};
 $('#lm2').onclick=()=>{mode='numbers';$('#lm2').className='on';$('#lm1').className='';draw()};
 $('#la').onclick=()=>start('professor',['ci_respiratori'],15);$('#lp').onclick=()=>start('exercicis',['ci_respiratori'],15);draw()}

};

Object.assign(MODES.exercicis,{ic:IC.grid});Object.assign(MODES.escriptura,{ic:IC.pen});Object.assign(MODES.comprovacio,{ic:IC.target});
